# test — 原本 harness の門（spec-lint → trace-check）→ 単体テスト → 静的な門 を、フックを回避しても止まる層として回す。
# pre-commit は --no-verify で通れるので、同じ npm test を CI でも走らせる（回避不能な層）。
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --depth 1 --branch "$(grep -o 'develop-core#v[0-9.]*' apm.yml | cut -d'#' -f2)" https://github.com/tsay-dev/harness .harness
      - run: npm ci
      # 学習者役のパックの図を PNG に描く Chromium と、日本語の字形を含む依存のフォント（scripts/render_svg_png.mjs）
      - run: npx playwright install --with-deps chromium
      - run: npm test
