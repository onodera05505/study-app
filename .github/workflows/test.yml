# test — 手元に依らない検査（npm run test:ci ＝ scripts/run_portable_checks.sh）を、フックを回避しても止まる層として回す。
# 回すのは、検査の振り分け → 仕様と紐づきの検査 → 入口の一覧の突き合わせ → 手元に依らない UC の契約の実例 → 型 → 静的な門 → 手元に依らない単体テスト。
# 手元だけのテスト（*.local.test.ts(x)）・手元だけの UC の契約の実例・実行の記録の門（lint coverage）は回さず、手元の npm test が受け持つ（名前を最後に示す）。
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # テストが過去のコミットの版のファイルを git で読むので、履歴を全部取る
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 道具とテストが使う Python の部品（requirements.txt が宣言し、版を固定する）
      - run: python -m pip install -r requirements.txt
      # 原本 harness は apm.yml が固定しているコミットで取る
      - run: |
          ref="$(grep -o 'develop-core#[0-9a-f]\{40\}' apm.yml | cut -d'#' -f2)"
          git clone https://github.com/tsay-dev/harness .harness
          git -C .harness checkout --quiet "$ref"
      - run: npm ci
      # 学習者役のパックの図を PNG に描く Chromium と、日本語の字形を含む依存のフォント（scripts/render_svg_png.mjs）
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
