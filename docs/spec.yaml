# 要件（REQ）— 仕様書 ⇔ ユースケース ⇔ 要件 ⇔ コード ⇔ テスト のトレーサビリティの正本（要件の層）
#
# 層: 仕様書 docs/要件定義書_draft.md（traceconfig.json の spec_document.sections が規範的な節）
#     → ユースケース docs/usecases/UC-xxx.md（frontmatter の source に仕様書の節。基本の流れ 1. 2. … と 例外の流れ E1. …）
#     → 要件（このファイル。usecase と step で UC の 1 ステップに属する）→ コード（@implements REQ-xxx）→ テスト（@verifies REQ-xxx）
# 規則: ID は REQ-xxx の 3 桁連番。一度振った ID は再利用しない（次の空き番号は `bash scripts/trace_check --next req`、UC は `--next uc`）。
#       要件は 1 つの UC の 1 つのステップに属する。active な UC の全ステップに要件が 1 つ以上ある。
#       1 つの要件を実装するコードの単位は 1 つ（traceconfig の max_units_per_req）。複数か所に散るなら要件を分ける。1 つの単位が複数の要件を実現するのはよい。
#       status は draft（決めたが未実装。検査の対象外）／active（既定。実装とテストが要る）／withdrawn（取り下げ。ID は残す）。
#       書くのは「今どう振る舞うか」だけ（経緯は git と作業ログへ）。書き方は ~/.claude/brain/tools/trace/README.md「書き方」。

requirements:
  # ================= UC-001 SSO でログインして学びに入る =================
  - id: REQ-006
    usecase: UC-001
    step: 1
    quote: ["本番では学び側のパスワード画面・登録画面・合言葉は無い", "学び側で「まなびばでログイン」"]
    description: "学び側のログイン画面は、SSO 環境（/api/auth/config の sso が真）ではパスワード欄を出さず、まなびばへ誘導するボタンだけを出す"
    acceptance: "sso: true の設定で描いた Login にパスワードの入力欄が無く、まなびばの /sso/start へのリンクがある"
  - id: REQ-001
    usecase: UC-001
    step: 2
    quote: "Cookie は HttpOnly・SameSite=Lax。Secure は https のときだけ付ける（ローカルの http では付かない）"
    description: "まなびばの POST /api/login はメールとパスワードで認証し、HttpOnly・SameSite=Lax の Cookie（Secure は https のときだけ）でセッションを発行する"
    acceptance: "正しい認証情報で Set-Cookie が返り、HttpOnly と SameSite=Lax を含む。http のローカルでは Secure が付かない"
  - id: REQ-056
    usecase: UC-001
    step: E1
    quote: "認証に失敗したときは 401 で、文はメールアドレスが登録されているかどうかで変えない"
    description: "まなびばの POST /api/login は、メールかパスワードが違うとき 401 を返し、本文 {error} はメールの有無で変わらない共通文にする"
    acceptance: "存在しないメールと、存在するメールの誤パスワードで、同じ 401 と同じ {error} が返る"
  - id: REQ-045
    usecase: UC-001
    step: 3
    quote: "まなびばの入口は、学びの一覧（名前・種類・説明・入口。秘密は含めない）と本人のアカウントと権限を返す"
    description: "まなびばの GET /api/learnings は学びの一覧（key・brand・kind・desc・url）を返し、秘密を含まない"
    acceptance: "一覧の件数と key が登録簿と一致し、応答の文字列に SSO_SECRET などの秘密の値が無い"
  - id: REQ-046
    usecase: UC-001
    step: 3
    quote: ["本人のアカウントと権限を返す。ログインしていない人には本人と権限を返さない", "入口の一覧は権限のある学びだけ「開く」、無いものは「権限なし」と出す"]
    description: "まなびばの GET /api/me はログイン中の本人の account と grants（権限なしは []）を返し、未ログインは 401。画面はこれで権限のある学びだけを「開く」にする"
    acceptance: "ログイン後に account と grants が返り、未ログインは 401"
  - id: REQ-002
    usecase: UC-001
    step: 4
    quote: ["権限があれば使い捨てコードを付けて `学び/sso/callback?code=…` へ戻す", "使い捨てコードは 1 回・2 分"]
    description: "まなびばの GET /sso/start?app=<key> は、ログイン済みで対象の学びの権限がある人に使い捨てコード（120 秒）を発行し、学び側の /sso/callback?code=… へリダイレクトする"
    acceptance: "権限のある学びで 302 の Location が学び側の callback で、code が付く"
  - id: REQ-057
    usecase: UC-001
    step: E2
    quote: "権限の無い学びへ入ろうとしたときは拒否（denied）だけを返し、使い捨てコードを作らない。ログインしていないときはまなびばのログイン画面へ送る。ログイン後の戻り先はまなびば側が組み、外から渡された行き先は使わない"
    description: "まなびばの GET /sso/start は、権限の無い学びでは denied を返してコードを発行せず、未ログインならまなびばのログイン画面へ送る。戻り先はサーバが /sso/start から組み、外から渡された next は使わない"
    acceptance: "権限の無い学びで sso_codes に行が増えない。未ログインで Location がログイン画面。next に外部 URL を渡しても Location に出ない"
  - id: REQ-058
    usecase: UC-001
    step: 5
    quote: "戻り（`学び/sso/callback`）でコードが無い・交換に失敗したときは、ログインさせずに「ログインできなかった」旨と理由、まなびばへ戻る導線を出す"
    description: "学び側の /sso/callback 画面は URL の code を POST /api/auth/sso に渡し、返ったトークンを保存してホームへ移る。code が無い・交換に失敗したときはトークンを保存せず、ログインできなかった旨と理由、まなびばへ戻る導線を出す"
    acceptance: "code 付きで描くと /api/auth/sso が呼ばれ、成功でトークンが保存されてホームへ移る。失敗と code 無しではトークンが保存されず、失敗の旨・理由・まなびばへ戻る導線が描かれる"
  - id: REQ-003
    usecase: UC-001
    step: 6
    quote: ["学び側サーバが `まなびば/api/sso/exchange`（共有秘密 `SSO_SECRET`）でコードをメールと名前に交換", "使い捨てコードは 1 回・2 分。交換時に権限を再確認する（付け外しの直後でも通らない）"]
    description: "まなびばの POST /api/sso/exchange は、共有秘密が一致する呼び出しに限り、未使用で 120 秒以内のコードをメールと名前に交換し、交換時にも対象の学びの権限を再確認する。コードは使用済みにする"
    acceptance: "有効なコードで email と name が返り、sso_codes の行が used になる"
  - id: REQ-059
    usecase: UC-001
    step: E3
    quote: ["共有秘密が違う・無い呼び出しは 403 で拒む（共有秘密の確認は本文の検証より先）", "使い捨てコードは 1 回・2 分。交換時に権限を再確認する（付け外しの直後でも通らない）"]
    description: "まなびばの POST /api/sso/exchange は、使用済み・期限切れ・権限が外れたコードを拒否し、共有秘密が違えば 403 を返す"
    acceptance: "同じコードの 2 回目が拒否される。期限切れが拒否される。秘密違いは 403（不変条件 D18・O13）"
  - id: REQ-004
    usecase: UC-001
    step: 7
    quote: "学び側の `users` にメールで見つけるか作る（パスワード列は `sso`）→ 学び側の従来のトークンを発行"
    description: "学び側の POST /api/auth/sso は、code をまなびばの /api/sso/exchange で交換してメールと名前を得、users をメールで見つけるか passwordHash='sso' で作り、学び側のトークンを返す"
    acceptance: "有効なコードで token が返り、users に passwordHash が 'sso' の行がある。2 回目は同じ行を使う"
  - id: REQ-060
    usecase: UC-001
    step: E3
    quote: "まなびばに届かないときは 502、共有秘密が設定されていないときは 503 を返し、設定の不足を画面に出さない"
    description: "学び側の POST /api/auth/sso は、まなびばに届かないとき 502、SSO_SECRET が未設定のとき 503 を返す"
    acceptance: "SSO_SECRET 無しで 503。exchange の fetch が失敗すると 502"
  - id: REQ-061
    usecase: UC-001
    step: 7
    quote: "学び側のトークンは JWT（HS256）で、本人を指す値・名前・役割を持ち、14 日で切れる。秘密は入れない"
    description: "学び側のトークンは JWT（HS256）で、sub（利用者 ID）・name・role を持ち、有効期限は 14 日"
    acceptance: "issueToken の結果を readToken で戻すと sub・name・role が一致し、exp が発行から 14 日"
  - id: REQ-050
    usecase: UC-001
    step: 8
    quote: "発行されたトークンは端末の `localStorage` に保存し"
    description: "画面はトークンを端末の localStorage に保存する"
    acceptance: "setToken の後に localStorage にトークンがある"
  - id: REQ-062
    usecase: UC-001
    step: 8
    quote: "発行されたトークンは端末の `localStorage` に保存し、以後の API 呼び出しに `Authorization: Bearer` で付ける"
    description: "画面は保存したトークンを読む。無ければ null"
    acceptance: "保存前は getToken が null、保存後は同じ値"
  - id: REQ-063
    usecase: UC-001
    step: 8
    quote: "以後の API 呼び出しに `Authorization: Bearer` で付ける"
    description: "画面の API 呼び出しは、トークンがあれば Authorization: Bearer <トークン> を付ける"
    acceptance: "setToken 後の api() の fetch に Authorization: Bearer が付き、無ければ付かない"
  - id: REQ-053
    usecase: UC-001
    step: 8
    quote: "名前はトークンの中身から読み、サーバに聞かない"
    description: "本人の名前はトークン（JWT）の中身から読み、サーバに聞かない。トークンが無い・壊れている・name が無いときは null"
    acceptance: "getUserName がトークンの name を返し、無い・壊れている・name 無しは null"
  - id: REQ-064
    usecase: UC-001
    step: 8
    quote: ["ヘッダーにログインしている本人の名前を出す", "ログインしている人の名前（トークンから読む。全対象）"]
    description: "画面のヘッダーにログインしている本人の名前を出す。名前が読めないときは出さない"
    acceptance: "name を持つトークンで App のヘッダーに名前が出る。トークン無しでは出ない"
  - id: REQ-005
    usecase: UC-001
    step: E4
    quote: "学び側の `/api/auth/login` と `/register` は、`SSO_PORTAL_URL` が設定された環境（本番）では 404"
    description: "SSO_PORTAL_URL が設定された環境では、学び側の POST /api/auth/login は 404 を返す"
    acceptance: "SSO_PORTAL_URL ありで login が 404、無しで従来どおり動く（不変条件 D17）"
  - id: REQ-065
    usecase: UC-001
    step: E4
    quote: "学び側の `/api/auth/login` と `/register` は、`SSO_PORTAL_URL` が設定された環境（本番）では 404"
    description: "SSO_PORTAL_URL が設定された環境では、学び側の POST /api/auth/register は 404 を返す"
    acceptance: "SSO_PORTAL_URL ありで register が 404、無しで従来どおり動く（不変条件 D17）"
  - id: REQ-066
    usecase: UC-001
    step: E4
    quote: "学び側の画面は、その環境が SSO かどうか・まなびばの場所・自分の対象の key を聞ける。共有秘密が設定済みかどうかは返さない"
    description: "学び側の GET /api/auth/config は sso（SSO_PORTAL_URL の有無）・portal（その URL）・app（対象の key）だけを返し、秘密の有無（secretSet）を出さない"
    acceptance: "config の鍵が sso・portal・app の 3 つで、secretSet が無い"
  - id: REQ-067
    usecase: UC-001
    step: E5
    quote: "トークン付きで 401 なら期限切れの印を立ててトークンを捨て"
    description: "画面の API 呼び出しは、トークン付きの呼び出しが 401 を返したとき、期限切れの印（sessionStorage）を立ててトークンを捨てる。トークン無しの 401 では印を立てない"
    acceptance: "トークン有りで 401 → 印が立ちトークンが消える。トークン無しで 401 → 印が立たない"
  - id: REQ-052
    usecase: UC-001
    step: E5
    quote: "ログイン画面で **1 度だけ** 理由を伝える。自分でログアウトしたときは出さない"
    description: "期限切れの印は 1 度だけ取り出せる。取り出すと消え、無ければ false"
    acceptance: "takeSessionExpired は印があれば true を返して印を消し、2 回目は false。印が無ければ false"
  - id: REQ-068
    usecase: UC-001
    step: E5
    quote: "期限切れのときログイン画面に出す文は「ログインの有効期限が切れました。もう一度ログインしてください。」"
    description: "学び側のログイン画面は、期限切れの印があるときだけ「ログインの有効期限が切れました。もう一度ログインしてください。」の案内を出す。自分でログアウトしたときは出さない"
    acceptance: "印を立てて描くと「有効期限が切れました」を含む案内が出る。印が無ければ出ない"
  - id: REQ-069
    usecase: UC-001
    step: E5
    quote: "ログアウトと 401 で捨て、捨てるときは「前回の続き」も消す"
    description: "トークンを捨てるとき、「前回の続き」（最後に開いた論点と画面）も一緒に消す（同じ端末を分け合うことがある）"
    acceptance: "clearToken の後に localStorage のトークンと前回の続きが両方無い"
  # ================= UC-002 管理者がアカウントと権限を管理する =================
  - id: REQ-007
    usecase: UC-002
    step: 1
    quote: "管理の画面と管理の操作は、役割が管理者でない人を 403 で拒み、理由を返す"
    description: "まなびばの /api/admin/* は役割が ADMIN のアカウントの呼び出しだけを通し、利用者（MEMBER）の呼び出しには 403 と {error} を返す"
    acceptance: "一覧・作成・更新・パスワード再設定・削除の 5 経路すべてに、MEMBER でログインした人が当てると 403 が返り、役割も権限も変わらない"
  - id: REQ-070
    usecase: UC-002
    step: 2
    quote: ["アカウントの一覧は作った順に返す", "権限の無いアカウントの権限は空として返す"]
    description: "まなびばの GET /api/admin/accounts は全アカウントの id・メール・名前・役割・作成時刻と、その人に付いている学びの権限を作成順に返す。権限が無い人は空の配列にする"
    acceptance: "一覧の行が accounts の件数と一致し、作成時に付けた学びが grants に出る。権限の無い行の grants が [] で、null や欠落でない"
  - id: REQ-071
    usecase: UC-002
    step: 3
    quote: "管理者がアカウントを作るときは、メール・名前・初期パスワード・学びの権限・役割を決める。作るときに管理者も選べる"
    description: "まなびばの POST /api/admin/accounts は、メール・名前・初期パスワード・開ける学びからアカウントと権限の行を作り、役割の既定を MEMBER にして 201 を返す"
    acceptance: "201 の本文に id・メール・名前・役割・権限があり、役割が MEMBER。直後の一覧に同じ権限が出る"
  - id: REQ-072
    usecase: UC-002
    step: 4
    quote: "管理者は他人の名前・役割・学びの権限を変えられる。権限は送られた一覧に総入れ替えする"
    description: "まなびばの PUT /api/admin/accounts/:id は、送られた名前・役割・開ける学びを反映し、権限は送られた一覧で今の権限を置き換える（差分ではなく総入れ替え）"
    acceptance: "学びを 2 つ送ると一覧の権限が 2 つになり、1 つで送り直すと 1 つになる。名前の変更が一覧に出る。自分以外の役割は ADMIN と MEMBER のどちらにも変えられる"
  - id: REQ-073
    usecase: UC-002
    step: 5
    quote: "管理者がパスワードを再設定すると、その人が開いている全部の端末のログインが切れる"
    description: "まなびばの POST /api/admin/accounts/:id/password は、その人のパスワードのハッシュを入れ替え、その人が開いているセッションを全部消す"
    acceptance: "再設定の後、その人が開いていた Cookie で /api/me が 401 になり、新しいパスワードではログインでき、前のパスワードでは 401 になる"
  - id: REQ-074
    usecase: UC-002
    step: 6
    quote: ["アカウントの一覧・作成（メール・名前・初期パスワード・権限）・権限の付け外し・パスワード再設定・削除", "学び側の `users` は消さない（進捗・受験履歴の外部キー）"]
    description: "まなびばの DELETE /api/admin/accounts/:id は、アカウントの行とその権限の行を消す。学び側の利用者と進捗には触れない"
    acceptance: "削除の後、一覧にその人が居らず、grants にもその人の行が無い"
  - id: REQ-075
    usecase: UC-002
    step: E1
    quote: ["管理の画面で受け付ける値は、名前 1〜50 文字、初期パスワードと再設定のパスワード 8〜200 文字", "登録簿に無い学びの権限は受け付けない"]
    description: "まなびばの POST /api/admin/accounts は、メールの形が違う・名前が空か 50 文字を超える・初期パスワードが 8 文字未満か 200 文字を超える・知らない学びが権限に入っているとき、400 と {error} を返してアカウントを作らない"
    acceptance: "4 つの場合それぞれで 400 と日本語の {error} が返り、accounts の件数が増えない"
  - id: REQ-076
    usecase: UC-002
    step: E1
    quote: ["管理の画面で受け付ける値は、名前 1〜50 文字", "登録簿に無い学びの権限は受け付けない"]
    description: "まなびばの PUT /api/admin/accounts/:id は、名前が空か 50 文字を超える・知らない学びが権限に入っているとき、400 と {error} を返して何も変えない"
    acceptance: "知らない学びを混ぜた更新が 400 で、一覧の権限が変わっていない"
  - id: REQ-077
    usecase: UC-002
    step: E1
    quote: "初期パスワードと再設定のパスワード 8〜200 文字"
    description: "まなびばの POST /api/admin/accounts/:id/password は、新しいパスワードが 8 文字未満か 200 文字を超えるとき、400 と {error} を返してハッシュを入れ替えない"
    acceptance: "7 文字の再設定が 400 で、元のパスワードでログインできる"
  - id: REQ-078
    usecase: UC-002
    step: E2
    quote: "同じメールアドレスのアカウントは作れない。既にあるときは理由を出して受け付けない"
    description: "まなびばの POST /api/admin/accounts は、同じメールのアカウントがすでにあるとき 409 と {error} を返す"
    acceptance: "同じメールでの 2 回目の作成が 409 で、accounts の件数が増えない"
  - id: REQ-008
    usecase: UC-002
    step: E3
    quote: "管理者は自分の役割を利用者に下げられず、自分を削除できない（管理者が 0 人になるのを防ぐ。理由を出して受け付けない）"
    description: "まなびばの PUT /api/admin/accounts/:id は、呼び出した管理者が自分の役割を ADMIN 以外に変えようとしたとき 400 と {error} を返し、役割を変えない"
    acceptance: "自分の role を MEMBER にする更新が 400 で、accounts の自分の行が ADMIN のまま。他人の降格は 200 で通る"
  - id: REQ-079
    usecase: UC-002
    step: E4
    quote: "管理者は自分の役割を利用者に下げられず、自分を削除できない（管理者が 0 人になるのを防ぐ。理由を出して受け付けない）"
    description: "まなびばの DELETE /api/admin/accounts/:id は、呼び出した管理者が自分を削除しようとしたとき 400 と {error} を返し、消さない"
    acceptance: "自分の削除が 400 で、一覧に自分が残っている"
  - id: REQ-080
    usecase: UC-002
    step: E5
    quote: "存在しないアカウントを指す操作（権限の付け外し・再設定・削除）は、見つからないものとして扱う"
