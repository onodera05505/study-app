# 仕様（ユースケースと要件）— 仕様 ⇔ コード ⇔ テスト のトレーサビリティの正本
#
# 2026-09-28 初版（本人が同日承認）。出典: docs/要件定義書_draft.md（§4・5・9・10・13.5・13.6・15）、
# docs/不変条件と門.md（D11・D13・D16・D17・D18）、実装の現物（src/server、portal/src、src/client）。
# 載せたのは**今すでに実装されている挙動**だけ。未実装の機能（§5.5 の間隔反復・診断・逆算計画など）は
# 実装するときに要件を足す（実装前に ID を振る）。
#
# 規則: ID は UC-xxx / REQ-xxx の 3 桁連番。一度振った ID は再利用しない（次の空き番号は `bash scripts/trace_check --next req`）。
#       要件は 1 つ以上の UC に紐づく。UC は 1 つ以上の要件を持つ。
#       status は draft（決めたが未実装。検査の対象外）／active（既定。実装とテストが要る）／withdrawn（取り下げ。ID は残す）。
#       コードは `@implements REQ-xxx`、テストは `@verifies REQ-xxx`（`bash scripts/trace_check` が見る。複数は , 区切り）。
#       未実装の機能を決めたら draft で先に足し、実装で active にする。

usecases:
  - id: UC-001
    goal: "利用者がまなびば（入口）でログインし、権限のある学びに入れる（SSO）"
  - id: UC-002
    goal: "管理者がまなびばでアカウントを作り、学びごとの権限を付け外しし、パスワードを再設定できる"
  - id: UC-003
    goal: "利用者が自分のパスワードを変え、ログアウトできる"
  - id: UC-004
    goal: "利用者が 分野 → カテゴリ → 論点 の順に辿り、論点の解説と紐づく過去問を読める"
  - id: UC-005
    goal: "利用者が論点の理解度を 3 段階で記録し、おすすめ順（頻度が高く未理解）で学べる"
  - id: UC-006
    goal: "本文の用語ポップと図が、実データ全件で正しく描画される"
  - id: UC-007
    goal: "利用者が論点別・分野別・カテゴリ別・弱点復習の演習を解き、回答ごとに解説を読める"
  - id: UC-008
    goal: "利用者が本番形式の模擬試験を制限時間つきで受け、合否の目安と分野別の結果を見る"
  - id: UC-009
    goal: "利用者が演習・模試を中断して再開し、過去の受験履歴と結果を見返せる"
  - id: UC-010
    goal: "過去問を表示する全画面に出典が出て、改変した問題には「一部改変」が併記される（IPA の利用条件）"
  - id: UC-011
    goal: "同一内容の過去問は DB に全問残しつつ学習側で 1 問にまとめ、出題頻度は重複を数えたまま出る"
  - id: UC-012
    goal: "利用者が開いていた画面を添えて自由記述のフィードバックを送れる"
  - id: UC-013
    goal: "デプロイ後、開いたままの画面に「新しい版があります」の帯が出て、押したときだけ読み直す"
  - id: UC-014
    goal: "API は認証・入力検証・失敗の形・セキュリティヘッダで守られ、他人のデータに触れない"
  - id: UC-015
    goal: "ロードマップ型の対象では、論点が学ぶ順（sort_order）に並び、メニューは 2 つに絞られる"
  - id: UC-016
    goal: "利用者が前回開いていた論点・画面にすぐ戻れる"
  - id: UC-017
    goal: "運用者（本人）が、本番の生存・秘密の設定・データの保存先を機械で確かめられる（監視と検査の土台）"

requirements:
  # --- UC-001 SSO ---
  - id: REQ-001
    usecases: [UC-001]
    description: "まなびばの /api/login はメールとパスワードで認証し、HttpOnly・SameSite=Lax の Cookie を発行する（Secure は https のときだけ。ローカルの http でも動く）。失敗時の文言はメールの有無を漏らさない"
    acceptance: "正しい認証情報で Set-Cookie が返る。誤りは 401 で本文 {error} が共通文"
  - id: REQ-002
    usecases: [UC-001]
    description: "まなびばの /sso/start は、ログイン済みで対象の学びの権限がある人にだけ使い捨てコードを発行し、学び側へリダイレクトする。外から渡された next は使わず、未ログイン時の戻り先はサーバが組む。画面（portal/static/app.js）が辿る next は /sso/start で始まる値だけ"
    acceptance: "権限の無い学びでは denied でコードが発行されない。未ログインはログイン画面へ。next に外部 URL や別の経路を渡しても Location に出ない。画面側の絞り込みは check_portal_api が原文で見る"
  - id: REQ-003
    usecases: [UC-001]
    description: "まなびばの /api/sso/exchange は、使い捨てコードを 1 回・120 秒に限って交換し、交換時にも権限を再確認する。共有秘密が一致しないと 403"
    acceptance: "同じコードは 2 回使えない。期限切れは拒否。秘密違いは 403（不変条件 D18・O13）"
  - id: REQ-004
    usecases: [UC-001]
    description: "学び側の /api/auth/sso は、コードをまなびばで交換してメールと名前を得、初めての人なら users 行を passwordHash='sso' で作り、この学びのトークン（JWT HS256・14 日）を返す"
    acceptance: "有効なコードでトークンが返り、users に行がある。まなびば不通は 502、秘密未設定は 503"
  - id: REQ-005
    usecases: [UC-001, UC-014]
    description: "SSO_PORTAL_URL が設定された環境では、学び側の /api/auth/register と /api/auth/login は 404 を返す。/api/auth/config は sso・portal・app だけを返す（secretSet は出さない）"
    acceptance: "本番相当の環境で register/login が 404、config に secretSet が無い（不変条件 D17）"
  - id: REQ-006
    usecases: [UC-001]
    description: "学び側の画面は、SSO 環境ではまなびばへ誘導し、戻ってきたコードを /api/auth/sso に渡してトークンを保存する"
    acceptance: "Login 画面にパスワード欄が出ない。SsoCallback がトークンを保存してホームへ移る"

  # --- UC-002 / UC-003 まなびばの管理と自分の設定 ---
  - id: REQ-007
    usecases: [UC-002]
    description: "管理者だけが /api/admin/accounts の一覧・作成・更新（役割と学びの権限）・パスワード再設定・削除を使える。一般利用者は 403。パスワードを再設定すると、その人の開いているセッションは切れる"
    acceptance: "ADMIN 以外は 403。作成で grants が入り、更新で付け外しできる"
  - id: REQ-008
    usecases: [UC-002]
    description: "管理者は自分の管理者権限を外せず、自分を削除できない"
    acceptance: "自分の role を MEMBER にする更新と自分の削除が 400"
  - id: REQ-009
    usecases: [UC-003]
    description: "利用者は /api/me/password で現在のパスワードを確かめたうえで変更でき、/api/logout で Cookie が失効する。パスワードは 8〜200 文字"
    acceptance: "現在のパスワード違いは 401、範囲外の長さは 400。logout 後は /api/me が 401"

  # --- UC-004 / UC-005 学習 ---
  - id: REQ-010
    usecases: [UC-004]
    description: "/api/fields は分野ごとの論点数と自分の理解度の集計を、/api/categories はカテゴリ（middle）ごとの集計を返す。空のときは [] で返す（null ではない）"
    acceptance: "件数がローカル D1 の SELECT と一致。空一覧が []（不変条件 D11）"
  - id: REQ-011
    usecases: [UC-004, UC-005]
    description: "/api/topics は論点の一覧に出題回数（times）・自分の理解度（status）を付けて返し、頻度順に並べ替えられる。分野・カテゴリで絞れる"
    acceptance: "全件の times が topic_questions の件数と一致。status は未記録なら 0"
  - id: REQ-012
    usecases: [UC-004, UC-010]
    description: "/api/topics/:id は論点の解説（explanation・detail）、図、紐づく過去問（出典・一部改変・解説）を返す"
    acceptance: "全論点で explanation が空でなく、過去問に examLabel と number がある"
  - id: REQ-013
    usecases: [UC-005]
    description: "PUT /api/topics/:id/progress で理解度を 0〜3 の 3 段階（未理解／やや理解／理解）に記録し、UPSERT で上書きする"
    acceptance: "範囲外は 400。同じ論点に 2 回書くと最新が残る"
  - id: REQ-014
    usecases: [UC-005]
    description: "ホームのおすすめは「出題頻度が高く、まだ理解していない論点」を上から並べる"
    acceptance: "理解度 3 の論点はおすすめに出ない。並びは times の降順"
  - id: REQ-015
    usecases: [UC-004]
    description: "画面の一覧は取得前を null、結果が空を [] で区別し、読み込み中に「該当なし」を出さない"
    acceptance: "useState の初期値に空配列を使わない（scripts/check_source.py。不変条件 D11）"

  # --- UC-006 用語ポップと図 ---
  - id: REQ-016
    usecases: [UC-006]
    description: "本文の [[用語]] は用語集を引いて色付きの押せる語になり、押すと 1 行説明と（論点があれば）「この論点を学ぶ →」が出る。太字の中でも効く"
    acceptance: "実データ全件を jsdom で描いて、[[ ]] が文字のまま残らない（scripts/check_render.sh。不変条件 D10）"
  - id: REQ-017
    usecases: [UC-006]
    description: "教材の図（/figures/materials/<試験>/<id>-<n>.svg）は実在する画像を指し、試験ごとのディレクトリに分かれる"
    acceptance: "全教材の図パスが public に実在（check_seed・check_render。不変条件 D6）。画面は /figures/materials/ の行だけを画像にし、他の画像記法は文字のまま出す"
  - id: REQ-018
    usecases: [UC-006]
    description: "本文の記法（###・箇条書き・番号付き・太字・表・[[用語]]）だけを解釈し、それ以外は書かれた文字のまま出す"
    acceptance: "表の区切り行が無い表と `|` の混在を check_render が警告する"

  # --- UC-007 / UC-008 / UC-009 演習・模試・履歴 ---
  - id: REQ-019
    usecases: [UC-007]
    description: "POST /api/sessions は kind（drill／field／middle／review／mock）と範囲（topicId／field／middleNo）から問題を組み、既定の問題数は drill と mock が設定値、それ以外 20"
    acceptance: "kind ごとに範囲外の問題が入らない。size は 1〜100。既定の問題数（app_settings）は check_api が本番相当の DB で見る"
  - id: REQ-020
    usecases: [UC-007]
    description: "弱点復習（review）は自分が間違えた問題を、直近に間違えた順で集める。分野別・カテゴリ別・ランダム模試では、直近 N 回連続で正解した問題を当面出さない（N は設定値。全部が定着済みなら除外しない）"
    acceptance: "review に誤答の問題が新しい順で入る。field／middle／mock で連続正解した問題が出ず、全部が定着済みなら通常どおり出る"
  - id: REQ-021
    usecases: [UC-007, UC-008, UC-011]
    description: "セッションの出題では content_key が同じ過去問を 1 問にまとめ、代表は最新の回にする。模試（mock）は原本どおりで畳まない"
    acceptance: "drill で同じ content_key が 2 度出ない。mock で 1 回分の全問が順に出る"
  - id: REQ-022
    usecases: [UC-007, UC-008]
    description: "POST /api/sessions/:id/answer は位置（index）付きで回答を記録し、二重回答や位置ずれを拒む。正誤と解説（正解の根拠・誤答の note）を返す"
    acceptance: "同じ位置に 2 回答えると 409 か拒否。返る正誤が answer_key と一致"
  - id: REQ-023
    usecases: [UC-008]
    description: "模試は設定値の問題数と制限時間（app_settings の mock_size・mock_time_limit_sec）で出題され、時間切れで自動的に終了する"
    acceptance: "IP 100 問／120 分、AP 80 問／150 分（align_app_settings.sh）。残り時間が画面に出る"
  - id: REQ-024
    usecases: [UC-008]
    description: "結果画面は総合 60% 以上かつ各分野 30% 以上を合否の目安として表示し、IRT のため公式スコアと一致しない旨を明記する。分野別の正答率と、間違えた問題から論点への導線を出す"
    acceptance: "合格ライン到達／未達の文言と色が出て、分野別の表は 30% の境界（30 は到達・29 は未達）で色が分かれる。分野の基準が無い試験では色を付けない。分野別の正答率の合計が全体と整合"
  - id: REQ-025
    usecases: [UC-009]
    description: "GET /api/sessions/current で進行中のセッションを再開でき、DELETE /api/sessions/current で中断を破棄できる。/api/sessions は自分の履歴だけを返す"
    acceptance: "作成 → 1 問回答 → 中断 → 再開 → 全問回答 → finish → 結果 の一連が通る（check_api の流れ）"
  - id: REQ-026
    usecases: [UC-009, UC-014]
    description: "セッションの全 API は user_id で絞り、他人のセッション ID には 404 を返す"
    acceptance: "別アカウントを実際に作り、他人の ID で 404（check_api）"

  # --- UC-010 出典 ---
  - id: REQ-027
    usecases: [UC-010]
    description: "過去問には出典（試験・年度ラベル・問番号）が必須で、問題を表示する全画面（学習・演習・模試・結果・履歴）に「出典：<年度ラベル> <試験名> 問N」が出る"
    acceptance: "全過去問に examLabel と number があり、年度ラベルが内部コードのまま出ない（check_seed・verify_seed_remote。不変条件 D4）"
  - id: REQ-028
    usecases: [UC-010]
    description: "原文を書き換えた過去問には「一部改変」が併記される"
    acceptance: "modified が真の問題を表示すると「一部改変」が出る"

  # --- UC-011 同一問題 ---
  - id: REQ-029
    usecases: [UC-011]
    description: "同一内容（content_key 同一）の過去問で正解が割れていたら seed の門で止める。出題頻度（times）は重複を数えたまま"
    acceptance: "check_seed が正解の割れを問題として止める（不変条件 D2）。学習画面の頻度が topic_questions の件数と一致"

  # --- UC-012 フィードバック ---
  - id: REQ-030
    usecases: [UC-012]
    description: "POST /api/feedback は本文（2,000 字以内）と開いていた画面（page・topicId・questionId）を保存し、本人には受付文だけ返す。1 人 1 日 20 件を超えると 429。seed の投入で消えない"
    acceptance: "送信が feedback 表に入り、21 件目が 429。seed.sql が feedback 表に触れない（不変条件 D16）"
  - id: REQ-031
    usecases: [UC-012]
    description: "上部メニューの「フィードバック」から、開いていた論点・問題の ID が自動で添えられて送れる"
    acceptance: "論点画面から開くと topicId が入る。送信後に「フィードバックありがとうございます。改善に活かします。」が出る"

  # --- UC-013 新しい版 ---
  - id: REQ-032
    usecases: [UC-013]
    description: "ビルドのたびに version.json（コミットの短い ID と時刻）を出し、画面は画面遷移時と 5 分おきに取りに行き、違えば「新しい版があります。」の帯と「更新」ボタンを出す。自動では読み直さない"
    acceptance: "version.json が dist に出る。版が違うと帯が出て、押すまで再読み込みしない"

  # --- UC-014 API の保護 ---
  - id: REQ-033
    usecases: [UC-014]
    description: "/api/auth/* と /api/health 以外の API は Bearer トークンを要求し、無い・壊れている・期限切れなら 401 を返す"
    acceptance: "保護された全経路に未認証・壊れたトークンで 401（check_api の認証の境界）"
  - id: REQ-034
    usecases: [UC-014]
    description: "全 POST/PUT の入力は zod で検証し、失敗は 400。失敗の本文は {error: 日本語} で、メールアドレス・パスワード・お名前・合言葉は項目名つきの文にする"
    acceptance: "入力エラー 400／未知の経路 404／本文が {error} の日本語（check_api の失敗時の形）"
  - id: REQ-035
    usecases: [UC-014]
    description: "全応答に secureHeaders（CSP・HSTS・X-Frame-Options DENY・nosniff・Referrer-Policy）を付け、未処理例外は固定文の 500 で内部情報を出さない"
    acceptance: "本番 URL の curl -I で 5 つのヘッダが出る。onError の本文に stack が無い"
  - id: REQ-036
    usecases: [UC-014]
    description: "パスワードの PBKDF2 反復回数は 100,000 以下（Cloudflare Workers の上限）"
    acceptance: "ITERATIONS が 100,000 以下で定数が存在する（scripts/check_source.py。不変条件 O5）"

  # --- UC-015 ロードマップ型 ---
  - id: REQ-037
    usecases: [UC-015]
    description: "roadmap: true の対象では /api/topics を sort_order 順に返し、資格版では sort_order 列を参照しない"
    acceptance: "ロードマップ対象で並びが sort_order、資格版の SQL に sort_order が無い（不変条件 D13）"
  - id: REQ-038
    usecases: [UC-015]
    description: "ロードマップ型の画面は「ロードマップ」と「確認テスト」の 2 つのメニューに絞り、資格の語（模試・分野）を出さない。日ごとの確認テストは 1 日の単位数 × 2 問"
    acceptance: "確認テストの問題数が登録簿の questionsPerRound（check_seed。不変条件 D14）。メニューが 2 つであることは roadmap:true の対象のビルドで画面を見る（audit_screens。VITE_EXAM で分かれるため単体では見ない）"
  - id: REQ-039
    usecases: [UC-015, UC-004]
    description: "対象（試験・題材）ごとの名前・種類・設定は登録簿 src/shared/targets.json の 1 か所から読み、コードは対象名を列挙しない"
    acceptance: "examOf(key) が登録簿から解決される。new_target.py --check が通る（不変条件 D15）"

  # --- UC-016 前回の位置 ---
  - id: REQ-040
    usecases: [UC-016]
    description: "最後に開いた論点と画面を端末に覚え、ホームから「前回の続き」で戻れる"
    acceptance: "論点を開いて戻るとホームにその論点への導線が出る"

  # --- 2026-09-28 タグ付けで見つかった欠けと意図 ---
  - id: REQ-041
    usecases: [UC-008, UC-009]
    description: "/api/exams は回ごとに、問題数・自分が完了した受験回数・最高正答数を返す。並びは資格版が新しい回から、ロードマップ型は 1 日目から"
    acceptance: "回の件数が past_questions の回数と一致し、attempts と bestScore が自分の completed セッションだけを数える。ロードマップ対象で並びが昇順"
  - id: REQ-042
    usecases: [UC-007]
    status: draft
    description: "弱点復習（review）は、間違えた問題に加えて理解度が低い論点の問題も優先して出し、連続正解した問題は review でも当面出さない（要件定義書 §5.2 の意図。実装は誤答だけを集めている）"
    acceptance: "理解度 0〜1 の論点の問題が review に混ざる。直近 N 回連続正解の問題が review に出ない"
  - id: REQ-043
    usecases: [UC-004, UC-007]
    description: "図として描かれた過去問は、原本から切り出した画像（public/figures/<試験>/。試験ごとに分ける）を出し、書き起こし（表・擬似言語）を併記する。画像はタップで原寸に切り替え、表だけの問題は書き起こしを本体として出す"
    acceptance: "図つきの問題で画像が出て public/figures/<試験>/ に実在（check_seed）。閉じていないコードフェンスや列数の揃わない表の書き起こしでも例外を投げない"
  - id: REQ-044
    usecases: [UC-007]
    description: "組合せを問う選択肢（a：…／b：… の並び）は項目の切れ目で改行して縦に並べる。普通の読点では割らない。選択肢のデータは変えない"
    acceptance: "『／＋：』と『短い項目名＋：』の並びだけを割る。30 字以下は 1 行のまま"
  - id: REQ-045
    usecases: [UC-001]
    description: "まなびばの /api/learnings は学びの一覧（key・brand・kind・desc・url）を返し、秘密を含まない。画面は権限のある学びだけを「開く」のリンクにし、権限の無い学びは開けない"
    acceptance: "一覧の件数と key が登録簿と一致し、応答に秘密（SSO_SECRET など）の値が無い"
  - id: REQ-046
    usecases: [UC-001, UC-003]
    description: "まなびばの /api/me はログイン中の本人の account と grants（権限なしは []）を返し、未ログインは 401"
    acceptance: "ログイン後に account と grants が返り、未ログインと logout 後は 401"

