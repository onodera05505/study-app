    description: "学び側のデータは学びごとの Cloudflare D1 に保存し、サーバは drizzle のスキーマ定義（src/server/db/schema.ts）を通して読み書きする。生 SQL の連結はしない"
    acceptance: "getDb(env) が env.DB を束ねた drizzle を返し、schema の全表（users・topics・past_questions・sessions・feedback など）を query で引ける"
  - id: REQ-049
    usecases: [UC-014, UC-017]
    description: "トークンの署名に使う秘密は環境の JWT_SECRET（Pages の secret）から読む。未設定の環境（ローカル開発）では開発用の既定値を使い、本番では必ず secret を設定する"
    acceptance: "JWT_SECRET があればその値、無ければ既定値 'dev-only-insecure-secret' を返す。本番の secret 一覧に JWT_SECRET がある（wrangler pages secret list）"
  - id: REQ-050
    usecases: [UC-001]
    description: "学び側の画面は発行されたトークンを端末の localStorage に保存し、以後の API 呼び出しに Bearer で付ける。ログアウトと 401 で捨て、捨てるときは「前回の続き」も消す（同じ端末を分け合うことがある）"
    acceptance: "setToken 後の api() 呼び出しに Authorization: Bearer が付く。clearToken で トークンと前回の続きが両方消える"
  - id: REQ-051
    usecases: [UC-014]
    description: "画面の API 呼び出しは、失敗の本文 {error} を画面に出せる形（ApiError: message・status・body）で投げる。通信できないときは status 無しで日本語の固定文。トークン付きで 401 なら期限切れの印を立ててトークンを捨て、トークン無しの 401 では印を立てない"
    acceptance: "fetch が {error:'X'} の 400 を返すと ApiError('X', 400)。fetch が例外なら status undefined の日本語文。トークン有りの 401 で印が立ちトークンが消える"
