# UC-043 の境界: 運用者が手元で呼ぶ、コミットの件名の検査を入れる道具の入口 1 つ。振る舞いは ./UC.md の要件が持つ。
# 読み方は ../../../adr/ADR-0008-local-tool-boundary.md（手元の道具の境界を local-store で読む）と ../../../adr/ADR-0014-entries-from-apps-and-tools.md（入口の名前）。
# request の各欄は同じ名前の引数（引数は無い）。response の exitCode はプロセスの終了コード。
# これらの道具は断りの種類の名前を出さない（errors を持たない）。止まり方は要件と exitCode が持つ。
# 配備先のアカウント・保存先の名前・秘密の値は値なので書かない（R-102）。値の正本は scripts/pages_projects.json と src/shared/targets.json。
x-uc: UC-043
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-19

operations:
  installGithooks:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: このクローンの git のフックの置き場をリポジトリの中の置き場に向ける
    request:
      type: object
      additionalProperties: false
      properties: {}
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1] }
    errors: []
    examples:
      ok:
        request: {}
        response: { exitCode: 0 }
