# UC-037 の境界: 運用者が配備の前に呼ぶ、文書の検査の道具の入口 2 つ。振る舞いは ./UC.md の要件が持つ。
# 読み方は ../../../adr/ADR-0008-local-tool-boundary.md（手元の道具の境界を local-store で読む）と ../../../adr/ADR-0014-entries-from-apps-and-tools.md（入口の名前）。
# request の各欄は同じ名前の引数（root は --root）。response の exitCode はプロセスの終了コード。
# これらの道具は断りの種類の名前を出さない（errors: []）。止まり方は要件と exitCode が持つ。
x-uc: UC-037
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-19

operations:
  checkDocs:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 文書の索引・門の対応表・決定の記録・審議台帳を現物と照らす
    request:
      type: object
      additionalProperties: false
      properties:
        root: { type: string, minLength: 1, description: 照らすリポジトリの根。省略するとこのリポジトリ }
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1] }
    errors: []
    examples:
      ok:
        request: {}
        response: { exitCode: 0 }

  checkFeedbackLedger:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 審議台帳の各行が名指す規則が判断基準にあるかを照らす
    request:
      type: object
      additionalProperties: false
      properties: {}
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1] }
    errors: []
    examples:
      ok:
        request: {}
        response: { exitCode: 0 }
