# UC-018 の境界: 作り手が手元で呼ぶ資格対策の教材の門の入口 1 つと、門が読むファイル（教材の世代・論点・過去問・登録簿の学びの種類・図）の形。
# 読み方は docs/adr/ADR-0008（手元の道具の境界を local-store で読む）。パスは相対ならコマンドを呼んだ作業ディレクトリが起点。
x-uc: UC-018
x-status: draft
x-spec: ./UC.md
x-updated: 2026-11-11

schemas:
  Finding:
    type: object
    required: [kind, where, reason]
    properties:
      kind: { type: string, minLength: 1 }
      where: { type: string, minLength: 1, description: ファイル・論点・箇所のどれか }
      reason: { type: string, minLength: 1 }

operations:
  checkMaterials:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 資格対策の学びの教材の世代を教材の門にかけ、通すか止めるかと理由を返す
    request:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^data/[a-z]+$", description: 学びの置き場。末尾が登録簿の学びの key }
        dirs:
          type: array
          minItems: 1
          description: 見る教材の世代の置き場の並び。省略すると materials・materials_v2・materials_v3 の並び
          items: { type: string, pattern: "^materials(_v[0-9]+)?$" }
        public: { type: string, minLength: 1, description: 図の画像の配信の置き場。省略すると public }
    response:
      type: object
      required: [exitCode, topics, stops, warnings, limits]
      properties:
        exitCode: { type: integer, enum: [0, 1], description: 0 は通した、1 は stops が 1 件以上 }
        topics: { type: integer, minimum: 0, description: 門が見た教材の論点の数 }
        stops:
          type: array
          description: 当たった物を件数で打ち切らずにすべて持つ
          items:
            allOf:
              - { $ref: "#/schemas/Finding" }
              - properties:
                  kind:
                    enum: [unreadableOutput, termMismatch, orphanMaterial, missingMaterial, duplicate, missingElement, brokenTable, headingLevel, figureMissing, unresolvedTerm, pastQuestionQuote]
        warnings:
          type: array
          description: exitCode を変えない。当たった物を件数で打ち切らずにすべて持つ。情報の量の種類は無い
          items:
            allOf:
              - { $ref: "#/schemas/Finding" }
              - properties:
                  kind:
                    enum: [solvingHint, sameAsChoiceNote, notationOutside, unclosedEmphasis, styleMinority, plainListEnding, firstSentenceNotTerm, calcWithoutFormula, termMarkupMixed, indentedLine, sourcePunctuation, choiceSymbol, explanationHeading, tableTooNarrow, tableTooShort, tableTooWide, tableTooLong, tableCellLong]
        limits:
          type: object
          description: 門が使った閾値と表示の制約
          required: [quoteLength, headingLevel, requiredExplanationLine, tableColumns, tableRows, tableCellLength]
          properties:
            quoteLength: { type: integer, const: 30, description: 過去問の原文とこの字数以上連続して一致したら止める }
            headingLevel: { type: string, const: "###", description: 詳しい解説の見出しはこの階層だけ }
            requiredExplanationLine: { type: string, const: キーワード, description: 説明が必ず含む行の語 }
            tableColumns: { type: object, properties: { min: { const: 2 }, max: { const: 4 } }, description: 下回っても超えても警告 }
            tableRows: { type: object, description: ヘッダを含み区切りの行を数えない。下回っても超えても警告, properties: { min: { const: 2 }, max: { const: 8 } } }
            tableCellLength: { type: integer, const: 40, description: 超えたら警告 }
    errors:
      - code: INVALID_INPUT
        when: 登録簿に無い学び
      - code: INVALID_INPUT
        when: 資格対策でない学び
      - code: NOT_FOUND
        when: 指定した教材の世代の置き場が無い
    examples:
      pass:
        request: { data: data/ip }
        response:
          exitCode: 0
          topics: 532
          stops: []
          warnings: []
          limits: { quoteLength: 30, headingLevel: "###", requiredExplanationLine: キーワード, tableColumns: { min: 2, max: 4 }, tableRows: { min: 2, max: 8 }, tableCellLength: 40 }
      unknownLearning:
        request: { data: data/zzz }
        error: INVALID_INPUT
      notQualification:
        request: { data: data/itc }
        error: INVALID_INPUT
      dirMissing:
        request: { data: data/ip, dirs: [materials_v9] }
        error: NOT_FOUND
      notQualificationBeforeDirMissing:
        request: { data: data/itc, dirs: [materials_v9] }
        error: INVALID_INPUT

  readLearningKind:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 登録簿（src/shared/targets.json）から、その学びの種類を読む
    request:
      type: object
      required: [learning]
      properties:
        learning: { type: string, pattern: "^[a-z]+$", description: 登録簿の学びの key }
    response:
      type: object
      description: 登録簿のその学びの項のうち門が読む欄
      required: [kind]
      properties:
        kind: { type: string, enum: [exam, roadmap], description: exam が資格対策 }
    errors:
      - code: NOT_FOUND
        when: 登録簿に無い学び
    examples:
      ok:
        request: { learning: ip }
        response: { kind: exam }
      unknown:
        request: { learning: zzz }
        error: NOT_FOUND

  readTopics:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学びの論点の一覧を読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/topics\\.json$" }
    response:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            type: object
            required: [topic_id, term]
            properties:
              topic_id: { type: integer, minimum: 1 }
              term: { type: string, minLength: 1 }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/topics.json }
        response: { topics: [{ topic_id: 1, term: 個人情報保護法 }] }
      missing:
        request: { path: data/zzz/topics.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/ip/topics.json }
        error: INVALID_INPUT

  readPastQuestions:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 1 回分の過去問の原文を読む（引用の一致を見るため）
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/questions/[0-9a-z]+\\.json$" }
    response:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/questions/2018h30h.json }
        response: { questions: [{ text: "…" }] }
      missing:
        request: { path: data/ip/questions/1999h11h.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/ip/questions/2018h30a.json }
        error: INVALID_INPUT

  readMaterialFile:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 教材の世代の置き場にある 1 つのファイルの教材を読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/materials(_v[0-9]+)?/[A-Za-z0-9_]+\\.json$" }
    response:
      type: object
      required: [materials]
      properties:
        materials:
          type: array
          items:
            type: object
            required: [topic_id, term, explanation, detail]
            properties:
              topic_id: { type: integer, minimum: 1 }
              term: { type: string, minLength: 1 }
              explanation: { type: string, minLength: 1 }
              detail: { type: string, minLength: 1 }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/materials_v3/expl_01.json }
        response: { materials: [{ topic_id: 1, term: 個人情報保護法, explanation: "**個人情報保護法**は…" }] }
      missing:
        request: { path: data/ip/materials_v3/expl_99.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/ip/materials_v3/expl_02.json }
        error: INVALID_INPUT

  readFigure:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 教材の図の行が指す画像を、配信の置き場から読む
    request:
      type: object
      required: [src]
      properties:
        src: { type: string, pattern: "^/figures/[a-z]+/.+\\.(svg|png)$", description: 本文の図の行の参照先。実体は配信の置き場の下の同じパス }
    response:
      type: object
      required: [file]
      properties:
        file: { type: string, pattern: "^public/figures/[a-z]+/.+\\.(svg|png)$" }
    errors:
      - code: NOT_FOUND
        when: 画像が置き場所に無い
    examples:
      ok:
        request: { src: /figures/ip/2018h30h-q5.png }
        response: { file: public/figures/ip/2018h30h-q5.png }
      missing:
        request: { src: /figures/ip/9999-q1.png }
        error: NOT_FOUND
