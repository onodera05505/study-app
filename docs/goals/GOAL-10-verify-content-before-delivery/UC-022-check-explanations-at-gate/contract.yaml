# UC-022 の境界: 作り手が手元で呼ぶ問題解説の門の入口 1 つと、門が読むファイル（入力の束・書き手の問題解説・過去問・正解表・用語の上書き・登録簿）の形。
# 読み方は docs/adr/ADR-0008（手元の道具の境界を local-store で読む）。パスは相対ならコマンドを呼んだ作業ディレクトリが起点。
x-uc: UC-022
x-status: draft
x-spec: ./UC.md
x-updated: 2026-11-07

schemas:
  Finding:
    type: object
    required: [kind, where, reason]
    properties:
      kind: { type: string, minLength: 1 }
      where: { type: string, minLength: 1, description: ファイル・問題・選択肢・箇所のどれか }
      reason: { type: string, minLength: 1 }

operations:
  checkExplanations:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 資格対策の学びの問題解説を教材の門にかけ、通すか止めるかと理由を返す
    request:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^data/[a-z]+$", description: 学びの置き場。末尾が登録簿の学びの key }
        bundles: { type: string, minLength: 1, description: 問題解説の入力の束の置き場。省略すると学びの置き場の explanation_bundles }
    response:
      type: object
      required: [exitCode, questions, stops, warnings, limits]
      properties:
        exitCode: { type: integer, enum: [0, 1], description: 0 は通した、1 は stops が 1 件以上 }
        questions: { type: integer, minimum: 0, description: 門が見た問題解説の数 }
        stops:
          type: array
          description: 当たった物を件数で打ち切らずにすべて持つ
          items:
            allOf:
              - { $ref: "#/schemas/Finding" }
              - properties:
                  kind:
                    enum: [unreadableOutput, missingExplanation, duplicate, missingElement, answerKeyMismatch, questionMissing, contentKeyMismatch, correctMarkMismatch, pastQuestionQuote, unresolvedTerm]
        warnings:
          type: array
          description: exitCode を変えない。当たった物を件数で打ち切らずにすべて持つ。情報の量の種類は無い
          items:
            allOf:
              - { $ref: "#/schemas/Finding" }
              - properties:
                  kind:
                    enum: [plainNote, noteValueOnly, termNotesDiffer, labelOrder, representativeNotNewest, choiceNoteLong]
        limits:
          type: object
          description: 門が使った閾値と表示の制約
          required: [quoteLength, choiceNoteLength]
          properties:
            quoteLength: { type: integer, const: 30, description: 過去問の原文とこの字数以上連続して一致したら止める }
            choiceNoteLength: { type: integer, const: 90, description: 用語の説明に使う選択肢ごとの説明がこの字数を超えたら警告 }
    errors:
      - code: INVALID_INPUT
        when: 登録簿に無い学び
      - code: INVALID_INPUT
        when: 資格対策でない学び
      - code: NOT_FOUND
        when: 入力の束の置き場が無い
    examples:
      pass:
        request: { data: data/ip }
        response:
          exitCode: 0
          questions: 1100
          stops: []
          warnings: []
          limits: { quoteLength: 30, choiceNoteLength: 90 }
      unknownLearning:
        request: { data: data/zzz }
        error: INVALID_INPUT
      notQualification:
        request: { data: data/itc }
        error: INVALID_INPUT
      bundlesMissing:
        request: { data: data/ip, bundles: data/ip/explanation_bundles_x }
        error: NOT_FOUND
      notQualificationBeforeBundlesMissing:
        request: { data: data/itc, bundles: data/ip/explanation_bundles_x }
        error: INVALID_INPUT

  readLearningKind:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 登録簿（src/shared/targets.json）から、その学びの種類を読む
    request:
      type: object
      required: [learning]
      properties:
        learning: { type: string, pattern: "^[a-z]+$", description: 登録簿の学びの key }
    response:
      type: object
      description: 登録簿のその学びの項のうち門が読む欄
      required: [kind]
      properties:
        kind: { type: string, enum: [exam, roadmap], description: exam が資格対策 }
    errors:
      - code: NOT_FOUND
        when: 登録簿に無い学び
    examples:
      ok:
        request: { learning: ip }
        response: { kind: exam }
      unknown:
        request: { learning: zzz }
        error: NOT_FOUND

  readExplanationBundle:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 問題解説の入力の束 1 つ（書き手に渡した問題）を読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^.+/expl_[0-9]+\\.json$" }
    response:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id: { type: string, minLength: 1 }
    errors:
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/explanation_bundles/expl_01.json }
        response: { questions: [{ question_id: 2026r08-q97 }] }
      unreadable:
        request: { path: data/ip/explanation_bundles/expl_02.json }
        error: INVALID_INPUT

  readExplanations:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 書き手が書いた問題解説のファイル 1 つを読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/question_explanations/expl_[0-9]+\\.json$" }
    response:
      type: object
      required: [explanations]
      properties:
        explanations:
          type: array
          items:
            type: object
            required: [question_id, content_key, correct, correct_reason, choices]
            properties:
              question_id: { type: string, minLength: 1 }
              content_key: { type: string, pattern: "^[0-9a-f]{16}$", description: 同一内容の判定の値。作り方は BR-052 }
              correct: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
              correct_reason: { type: string, minLength: 1 }
              choices:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: object
                  required: [label, note]
                  properties:
                    label: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
                    term: { type: [string, "null"], description: 用語の説明の出どころになる語 }
                    note: { type: string, minLength: 1, description: 正解の説明は「正解」で始まり、誤答の説明は「正解」で始まらない }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/question_explanations/expl_01.json }
        response:
          explanations: [{ question_id: 2026r08-q97, content_key: 50bfe9f96eabc25f, correct: イ, correct_reason: "…", choices: [{ label: ア, term: null, note: "…" }, { label: イ, term: null, note: "正解。…" }, { label: ウ, term: null, note: "…" }, { label: エ, term: null, note: "…" }] }]
      missing:
        request: { path: data/ip/question_explanations/expl_99.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/ip/question_explanations/expl_02.json }
        error: INVALID_INPUT

  readAnswerKeys:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学びの正解表を読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/answer_keys\\.json$" }
    response:
      type: object
      description: 問題の識別子 → 正解
      additionalProperties: { type: string }
    errors:
      - code: NOT_FOUND
        when: 正解表が無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/answer_keys.json }
        response: { 2026r08-q97: イ }
      missing:
        request: { path: data/zzz/answer_keys.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/ip/answer_keys.json }
        error: INVALID_INPUT

  readPastQuestions:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 1 回分の過去問を読む（指す過去問・同一内容の鍵・引用の一致を見るため）
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/questions/[0-9a-z]+\\.json$" }
    response:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              choices: { type: object, additionalProperties: { type: string } }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/questions/2018h30h.json }
        response: { questions: [{ text: "…", choices: { "ア": "…", "イ": "…", "ウ": "…", "エ": "…" } }] }
      missing:
        request: { path: data/ip/questions/1999h11h.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/ip/questions/2018h30a.json }
        error: INVALID_INPUT

  readGlossaryOverrides:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学びの用語の上書きを読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^data/[a-z]+/glossary_overrides\\.json$" }
    response:
      type: object
      description: 用語 → 説明
      additionalProperties: { type: string }
    errors:
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/ip/glossary_overrides.json }
        response: { RPA: "…" }
      unreadable:
        request: { path: data/zzz/glossary_overrides.json }
        error: INVALID_INPUT
