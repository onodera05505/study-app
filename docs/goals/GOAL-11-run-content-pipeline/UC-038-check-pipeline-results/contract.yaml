# UC-038 の境界: 作り手が手元で呼ぶ、取り込み・分類・書き直し・手順書の結果を照らす道具の入口 5 つ。振る舞いは ./UC.md の要件が持つ。
# 読み方は ../../../adr/ADR-0008-local-tool-boundary.md（手元の道具の境界を local-store で読む）と ../../../adr/ADR-0014-entries-from-apps-and-tools.md（入口の名前）。
# request の各欄は同じ名前の引数（checkAnswerability の exam と specInventory の path は第 1 引数。answersDir は --answers-dir のように、大文字の前に - を入れた小文字）。response の exitCode はプロセスの終了コード。
# これらの道具は断りの種類の名前を出さない（errors: []）。止まり方は要件と exitCode が持つ。
x-uc: UC-038
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-19

operations:
  checkAnswerability:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 抽出した問題文だけで解いた結果を正解表と照らす
    request:
      type: object
      required: [exam]
      additionalProperties: false
      properties:
        exam: { type: string, minLength: 1, description: 回の ID }
        answersDir: { type: string, minLength: 1 }
        questionsDir: { type: string, minLength: 1 }
        key: { type: string, minLength: 1, description: 正解表 }
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1] }
    errors: []
    examples:
      ok:
        request: { exam: 2024r06 }
        response: { exitCode: 0 }

  checkAnswerabilityMaterials:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 教材だけで解いた結果を正解表と照らす
    request:
      type: object
      additionalProperties: false
      properties:
        data: { type: string, minLength: 1 }
        results: { type: string, minLength: 1, description: 解いた結果の置き場 }
        top: { type: integer, minimum: 1, description: 種類ごとに挙げる数の上限 }
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1] }
    errors: []
    examples:
      ok:
        request: { data: data/ip, results: data/ip/answerability_results }
        response: { exitCode: 0 }

  checkClassified:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 分類の結果の網羅・分野・項目番号を確かめる
    request:
      type: object
      additionalProperties: false
      properties:
        data: { type: string, minLength: 1 }
        count: { type: integer, minimum: 1, description: 1 回あたりの問題数 }
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1] }
    errors: []
    examples:
      ok:
        request: { data: data/ap }
        response: { exitCode: 0 }

  checkMaterialCoverage:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 書き直した世代で前の世代から落ちた語と短くなった論点を挙げる
    request:
      type: object
      additionalProperties: false
      properties:
        data: { type: string, minLength: 1 }
        top: { type: integer, minimum: 1, description: 挙げる数の上限 }
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0] }
    errors: []
    examples:
      ok:
        request: { data: data/ip }
        response: { exitCode: 0 }

  specInventory:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 書き換えた手順書に前の版の決まりが残っているかを照らす
    request:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1, description: 照らす手順書 }
        old: { type: string, minLength: 1, description: 前の版の git の版かファイル。省略すると HEAD }
        dropped: { type: string, minLength: 1, description: 消した決まりと理由の一覧 }
        quiet: { type: boolean }
    response:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer, enum: [0, 1, 2] }
    errors: []
    examples:
      ok:
        request: { path: scripts/prompts/write_materials.md }
        response: { exitCode: 0 }
