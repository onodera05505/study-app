      okNoUnanswered:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90" }
        response:
          session:
            id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90"
            kind: drill
            scopeLabel: "論点「オープンソースソフトウェア」"
            questionCount: 10
            sourceExam: null
          question: null
          finished: true
          expired: false
          answered: 10
          remainingSec: null
      okMockQuestion:
        request: { id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55" }
