operations:
  # 分野の一覧（GET /api/fields）と単元の一覧（GET /api/categories）は同じ経路なので UC-002 の契約が正本（UC-002: listFields / listCategories。ADR-0001 の決め 10）
  # テストの経路（作る・現在の問題・回答・締め・結果）は演習と模試（UC-008）で同じなので、この契約が正本。模試に固有の経路は UC-008 の listExams だけ
  startSession:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 選んだ種別と範囲で進行中のテストを 1 つ作り、範囲の名前・問題数・制限時間を返す（失敗の本文は ErrorBody だけ。断られた画面は UC-006 の getCurrentSession で進行中のテストを取り直す）
    wire:
      method: POST
      path: /api/sessions
      success: 201
    request:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "../../../_shared/components.yaml#/schemas/SessionKind"
        topicId:
          type: integer
          minimum: 1
        field:
          type: string
          minLength: 1
        middleNo:
          type: integer
          minimum: 1
        exam:
          type: string
          minLength: 1
          description: 模試の回の ID（UC-008 の listExams の exam）。模試で省略すると全範囲のランダム構成になる
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: 省略時は登録簿の値。模試で回を指定したときは無視される
      oneOf:
        - { properties: { kind: { const: drill } }, required: [kind, topicId] }
        - { properties: { kind: { const: field } }, required: [kind, field] }
        - { properties: { kind: { const: middle } }, required: [kind, middleNo] }
        - { properties: { kind: { const: review } }, required: [kind] }
        - { properties: { kind: { const: mock } }, required: [kind] }
    response:
      type: object
      required: [id, kind, scopeLabel, questionCount, timeLimitSec]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "../../../_shared/components.yaml#/schemas/SessionKind" }
        scopeLabel: { type: string, minLength: 1 }
        questionCount: { type: integer, minimum: 1 }
        timeLimitSec: { type: [integer, "null"], minimum: 1, description: 模試だけが持ち、演習は null }
      oneOf:
        - { properties: { kind: { const: mock }, timeLimitSec: { type: integer, minimum: 1 } } }
        - { properties: { kind: { enum: [drill, field, middle, review] }, timeLimitSec: { type: "null" } } }
    errors:
      - code: UNAUTHENTICATED
        when: Authorization の Bearer トークンが無い、または読めない
        wire: { status: 401 }
      - code: INVALID_INPUT
        when: 本文が kind・topicId・field・middleNo・exam・size の形を満たさない
        wire: { status: 400 }
      - code: CONFLICT
        when: 進行中のテストが既にある
        wire: { status: 409 }
      - code: NOT_FOUND
        when: 選んだ範囲に出題できる問題が 1 問も無い
        wire: { status: 404 }
      - code: INTERNAL
        when: テストを作る途中で出題の保存に失敗した
        wire: { status: 500 }
    examples:
      okDrill:
        request: { kind: drill, topicId: 2 }
        response:
          id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90"
          kind: drill
          scopeLabel: "論点「オープンソースソフトウェア」"
          questionCount: 10
          timeLimitSec: null
      okField:
        request: { kind: field, field: "テクノロジ系", size: 20 }
        response:
          id: "1c0b9f2d-7e55-4b3a-8c21-0d9f6a4e7b13"
          kind: field
          scopeLabel: "分野「テクノロジ系」"
          questionCount: 20
          timeLimitSec: null
      okMiddle:
        request: { kind: middle, middleNo: 12 }
        response:
          id: "4e7a2b90-c13d-4f56-8a07-2d9b6e1f3c85"
          kind: middle
          scopeLabel: "単元「セキュリティ」"
          questionCount: 20
          timeLimitSec: null
      okReview:
        request: { kind: review }
        response:
          id: "b5d6c1a0-3f48-4e97-9d52-7a1c8e0b6f34"
          kind: review
          scopeLabel: "間違えた問題の復習"
          questionCount: 20
          timeLimitSec: null
      okMockExam:
        request: { kind: mock, exam: 2024r06 }
        response:
          id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55"
          kind: mock
          scopeLabel: 令和6年度 を通しで受験
          questionCount: 100
          timeLimitSec: 7200
      okMockRandom:
        request: { kind: mock }
        response:
          id: "9c5d41b2-0e7a-4f38-b6c1-5a0d3e92f7aa"
          kind: mock
          scopeLabel: 全範囲からランダム100問
          questionCount: 100
          timeLimitSec: 7200
      invalidKind:
        request: { kind: daily }
        error: INVALID_INPUT
      missingScopeForKind:
        request: { kind: drill }
        error: INVALID_INPUT
      invalidSize:
        request: { kind: field, field: "テクノロジ系", size: 101 }
        error: INVALID_INPUT
      invalidMockSize:
        request: { kind: mock, size: 0 }
        error: INVALID_INPUT
      inProgress:
        request: { kind: middle, middleNo: 23 }
        error: CONFLICT
      emptyScope:
        request: { kind: drill, topicId: 9999 }
        error: NOT_FOUND
      emptyMockScope:
        request: { kind: mock, exam: 2009h21a }
        error: NOT_FOUND
      inProgressBeforeEmptyScope:
        request: { kind: drill, topicId: 9999 }
        error: CONFLICT
      unauthenticatedBeforeInvalidKind:
        request: { kind: daily }
        error: UNAUTHENTICATED
      saveFailed:
        request: { kind: middle, middleNo: 12 }
        error: INTERNAL

  getCurrentQuestion:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 進行中のテストの現在の問題（未回答の最小位置）を、範囲と進み具合と残り時間とともに返す
    wire:
      method: GET
      path: /api/sessions/{id}/current
      success: 200
    request:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    response:
      type: object
      required: [session, question, answered, remainingSec, finished]
      properties:
        session:
          type: object
          required: [id, kind, scopeLabel, questionCount, sourceExam]
          additionalProperties: false
          description: テストが終わっていてもこの 5 鍵だけ
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: "../../../_shared/components.yaml#/schemas/SessionKind" }
            scopeLabel: { type: string, minLength: 1 }
            questionCount: { type: integer, minimum: 1 }
            sourceExam: { type: [string, "null"], description: 模試の回の ID。ランダム構成と演習は null }
        question:
          oneOf:
            - $ref: "../../../_shared/components.yaml#/schemas/QuestionSnapshot"
            - type: "null"
        answered: { type: integer, minimum: 0 }
        remainingSec: { type: [integer, "null"], minimum: 0, description: 制限時間の無いテストは null }
        finished: { type: boolean }
        expired: { type: boolean, description: finished が true の応答にだけ入る }
    errors:
      - code: UNAUTHENTICATED
        when: Authorization の Bearer トークンが無い、または読めない
        wire: { status: 401 }
      - code: NOT_FOUND
        when: その ID のテストが無い、または本人のものでない
        wire: { status: 404 }
    examples:
      okInProgress:
