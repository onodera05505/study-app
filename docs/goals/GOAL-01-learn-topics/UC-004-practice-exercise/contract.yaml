            text: "インターネットの検索エンジンの検索結果において，自社のホームページの表示順位を，より上位にしようとするための技法や手法の総称はどれか。"
            choices: { "ア": "DNS", "イ": "RSS", "ウ": "SEO", "エ": "SNS" }
            citation: "出典：令和3年度 ITパスポート試験 問18"
            modified: false
            hasFigure: false
            figureDescription: null
            figureImage: null
            timesAsked: 2
            otherCitations: ["出典：平成30年度 秋期 ITパスポート試験 問3"]
          answered: 3
