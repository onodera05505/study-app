  answerQuestion:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 現在の問題に選んだ選択肢を送り、演習では正誤・正解の選択肢・問題解説・残りの未回答数を、模試では残りの未回答数と終わったかだけを受け取る（失敗の本文は ErrorBody だけ。断られた画面は getCurrentQuestion で位置・finished・expired を取り直す）
    wire:
      method: POST
      path: /api/sessions/{id}/answer
      success: 200
    request:
      type: object
      required: [id, idx, answer]
      properties:
        id: { type: string, format: uuid }
        idx: { type: integer, minimum: 0 }
        answer: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
    response:
      oneOf:
        - type: object
          description: 演習の応答
          required: [correct, correctAnswer, explanation, remaining, finished]
          properties:
            correct: { type: boolean }
            correctAnswer: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
            explanation:
              oneOf:
                - $ref: "../../../_shared/components.yaml#/schemas/Explanation"
                - type: "null"
            remaining: { type: integer, minimum: 0 }
            finished: { type: boolean }
        - type: object
          description: 模試の応答
          required: [remaining, finished]
          additionalProperties: false
          properties:
            remaining: { type: integer, minimum: 0 }
            finished: { type: boolean }
    errors:
      - code: UNAUTHENTICATED
        when: Authorization の Bearer トークンが無い、または読めない
        wire: { status: 401 }
      - code: INVALID_INPUT
        when: 本文が idx・answer の形を満たさない
        wire: { status: 400 }
      - code: NOT_FOUND
        when: その ID のテストが無い、または本人のものでない
        wire: { status: 404 }
      - code: CONFLICT
        when: テストが進行中でない
        wire: { status: 409 }
      - code: CONFLICT
        when: 残り時間が 0 に達している（演習の種別には制限時間が無い）
        wire: { status: 409 }
      - code: CONFLICT
        when: 未回答の問題が 1 問も無い
        wire: { status: 409 }
      - code: CONFLICT
        when: 送られた位置が現在の問題の位置と違う
        wire: { status: 409 }
      - code: CONFLICT
        when: 同じ位置への回答が先に記録された
        wire: { status: 409 }
    examples:
      okCorrect:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90", idx: 3, answer: "ウ" }
        response:
          correct: true
          correctAnswer: "ウ"
          explanation:
            correctReason: "正解。SEO は検索結果の表示順位を上げるための技法の総称です。"
            choices:
              - { label: "ア", term: "DNS", note: "ドメイン名と IP アドレスを対応づける仕組みの説明です。" }
              - { label: "イ", term: "RSS", note: "更新情報を配信する形式の説明です。" }
              - { label: "ウ", term: null, note: "正解。検索順位を上げる技法の総称です。" }
              - { label: "エ", term: "SNS", note: "人のつながりを扱うサービスの説明です。" }
          remaining: 6
          finished: false
      okNoExplanation:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90", idx: 4, answer: "ア" }
        response:
          correct: false
          correctAnswer: "イ"
          explanation: null
          remaining: 5
          finished: false
      okMock:
        request: { id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55", idx: 0, answer: "イ" }
        response: { remaining: 99, finished: false }
      invalidAnswer:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90", idx: 3, answer: "A" }
        error: INVALID_INPUT
      notFound:
        request: { id: "00000000-0000-4000-8000-000000000000", idx: 0, answer: "ア" }
        error: NOT_FOUND
      alreadyCompleted:
        request: { id: "b5d6c1a0-3f48-4e97-9d52-7a1c8e0b6f34", idx: 0, answer: "ア" }
        error: CONFLICT
      mockExpired:
        request: { id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55", idx: 7, answer: "ア" }
        error: CONFLICT
      staleIdx:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90", idx: 1, answer: "ア" }
        error: CONFLICT
      invalidBeforeNotFound:
        request: { id: "00000000-0000-4000-8000-000000000000", idx: -1, answer: "A" }
        error: INVALID_INPUT
      notFoundBeforeConflict:
        request: { id: "00000000-0000-4000-8000-000000000000", idx: 99, answer: "ア" }
        error: NOT_FOUND
      unauthenticated:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90", idx: 3, answer: "ウ" }
        error: UNAUTHENTICATED

  finishSession:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: テストを締めて正答数を確定し、正答数と問題数を返す
    wire:
      method: POST
      path: /api/sessions/{id}/finish
      success: 200
    request:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    response:
      type: object
      required: [ok, correct, total]
      properties:
        ok: { type: boolean, const: true }
        correct: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    errors:
      - code: UNAUTHENTICATED
        when: Authorization の Bearer トークンが無い、または読めない
        wire: { status: 401 }
      - code: NOT_FOUND
        when: その ID のテストが無い、または本人のものでない
        wire: { status: 404 }
    examples:
      ok:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90" }
        response: { ok: true, correct: 7, total: 10 }
      okAgain:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90" }
        response: { ok: true, correct: 7, total: 10 }
      okMock:
        request: { id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55" }
        response: { ok: true, correct: 64, total: 100 }
      notFound:
        request: { id: "00000000-0000-4000-8000-000000000000" }
        error: NOT_FOUND
      unauthenticated:
        request: { id: "8f14e45f-ea2b-4f1c-9a3e-6b1d2c7f4a90" }
        error: UNAUTHENTICATED

  getSessionResult:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 締めたテストの総合と分野別の正答率、合否の目安とその基準、問題ごとの振り返りを返す
    wire:
      method: GET
      path: /api/sessions/{id}
      success: 200
    request:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    response:
      type: object
      required: [session, overall, fields, passed, expired, criteria, approximation, items]
      properties:
        session:
          type: object
          required: [id, kind, scopeLabel, questionCount, sourceExam]
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: "../../../_shared/components.yaml#/schemas/SessionKind" }
            scopeLabel: { type: string, minLength: 1 }
            questionCount: { type: integer, minimum: 1 }
            sourceExam: { type: [string, "null"], description: 模試の回の ID。ランダム構成と演習は null }
            status: { type: string, enum: [in_progress, completed] }
            timeLimitSec: { type: [integer, "null"] }
            correctCount: { type: [integer, "null"] }
            startedAt: { type: integer }
            finishedAt: { type: [integer, "null"] }
            userId: { type: string }
        overall:
          type: object
          required: [total, correct, pct]
          properties:
            total: { type: integer, minimum: 0 }
            correct: { type: integer, minimum: 0 }
            pct: { type: integer, minimum: 0, maximum: 100 }
        fields:
          type: array
          items:
            type: object
            required: [field, total, correct, pct]
            properties:
              field: { type: string, minLength: 1 }
              total: { type: integer, minimum: 1 }
              correct: { type: integer, minimum: 0 }
              pct: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        expired: { type: boolean }
        criteria:
          type: object
          required: [overallPct, fieldPct]
          properties:
            overallPct: { type: integer, minimum: 0, maximum: 100 }
            fieldPct: { type: integer, minimum: 0, maximum: 100 }
        approximation: { type: string, minLength: 1 }
        items:
          type: array
          items:
            type: object
            required: [idx, text, choices, answer, userAnswer, result, citation, modified, hasFigure, figureDescription, figureImage, timesAsked, otherCitations, topicId, topicTerm, explanation]
            properties:
              idx: { type: integer, minimum: 0 }
              text: { type: string, minLength: 1 }
              choices: { type: object, description: ア・イ・ウ・エ を鍵にした選択肢の文 }
              answer: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
              userAnswer: { type: [string, "null"], enum: ["ア", "イ", "ウ", "エ", null] }
              result: { type: integer, enum: [0, 1, 2], description: 0 未回答 / 1 正答 / 2 誤答 }
              citation: { type: string, minLength: 1 }
              modified: { type: boolean }
              hasFigure: { type: boolean }
              figureDescription: { type: [string, "null"] }
              figureImage: { type: [string, "null"] }
              timesAsked: { type: integer, minimum: 1 }
              otherCitations: { type: array, items: { type: string } }
              topicId: { type: [integer, "null"] }
              topicTerm: { type: [string, "null"] }
              explanation:
                oneOf:
                  - $ref: "../../../_shared/components.yaml#/schemas/Explanation"
                  - type: "null"
    errors:
      - code: UNAUTHENTICATED
        when: Authorization の Bearer トークンが無い、または読めない
        wire: { status: 401 }
      - code: NOT_FOUND
        when: その ID のテストが無い、または本人のものでない
        wire: { status: 404 }
      - code: NOT_FOUND
        when: そのテストはまだ締められていない
        wire: { status: 404 }
    examples:
      ok:
        request: { id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55" }
        response:
          session: { id: "3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55", kind: mock, status: completed, sourceExam: 2024r06, scopeLabel: 令和6年度 を通しで受験, timeLimitSec: 7200, questionCount: 1, correctCount: 0, startedAt: 1759276800, finishedAt: 1759283500 }
          overall: { total: 1, correct: 0, pct: 0 }
          fields:
            - { field: テクノロジ系, total: 1, correct: 0, pct: 0 }
          passed: false
          expired: false
          criteria: { overallPct: 60, fieldPct: 30 }
          approximation: IPA の合否は項目応答理論（IRT）で算出され換算式が非公開のため、ここでの点数は素点による目安です。
          items:
            - idx: 0
              text: 情報セキュリティの三要素のうち、可用性に該当するものはどれか。
              choices: { ア: 許可された者だけが情報を参照できる, イ: 必要なときに情報を利用できる, ウ: 情報が改ざんされていない, エ: 行為者を後から特定できる }
              answer: イ
              userAnswer: ア
              result: 2
              citation: 令和6年度 問1
