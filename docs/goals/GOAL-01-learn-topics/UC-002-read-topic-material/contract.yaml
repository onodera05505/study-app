# UC-002 の境界契約。境界の形だけを持つ（振る舞いと規則は ./UC.md と同じ場所の REQ。ロードマップ型の応答の振る舞いは UC-009 の REQ）
# 読み方の決まりは ../../../adr/ADR-0001-boundary-reading.md（transport / direction / auth の当て方）
# 論点の教材からドリルを始める経路（REQ-273）は同じ POST /api/sessions なので UC-004 の契約が正本（UC-004: startSession。ADR-0001 の決め 10）
x-uc: UC-002
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-09

operations:
  listFields:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 分野ごとの集計（論点数・過去問数・理解度の内訳）を返す
    wire:
      method: GET
      path: /api/fields
      success: 200
    response:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: object
            required: [field, topics, questions, understood, partly, untouched]
            properties:
              field: { type: string }
              topics: { type: integer, minimum: 0 }
              questions: { type: integer, minimum: 0 }
              understood: { type: integer, minimum: 0 }
              partly: { type: integer, minimum: 0 }
              untouched: { type: integer, minimum: 0, description: "未理解の論点の数（理解度の記録が無い論点と、未理解を記録した論点の両方を数える）" }
    errors:
      - code: UNAUTHENTICATED
        when: トークンが無い、または読めない
        wire: { status: 401 }
    examples:
      ok:
        response:
          fields:
            - { field: "テクノロジ系", topics: 312, questions: 1680, understood: 40, partly: 12, untouched: 260 }
            - { field: "マネジメント系", topics: 96, questions: 440, understood: 8, partly: 4, untouched: 84 }
      unauthenticated:
        request: { authorization: "" }
        error: UNAUTHENTICATED

  listCategories:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 単元ごとの集計（大項目・分野つき、論点数・過去問数・理解した数）を返す
    wire:
      method: GET
      path: /api/categories
      success: 200
    request:
      type: object
      properties:
        field: { type: string, description: "指定した分野の単元だけに絞る。省略すると全分野" }
    response:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [middleNo, middle, major, field, topics, questions, understood]
            properties:
              middleNo: { type: integer }
              middle: { type: string }
              major: { type: string }
              field: { type: string }
              topics: { type: integer, minimum: 0 }
              questions: { type: integer, minimum: 0 }
              understood: { type: integer, minimum: 0 }
    errors:
      - code: UNAUTHENTICATED
        when: トークンが無い、または読めない
        wire: { status: 401 }
    examples:
      ok:
        request: { field: "テクノロジ系" }
        response:
          categories:
            - { middleNo: 12, middle: "セキュリティ", major: "技術要素", field: "テクノロジ系", topics: 38, questions: 214, understood: 6 }
      unauthenticated:
        request: { authorization: "" }
        error: UNAUTHENTICATED

  listTopics:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 単元・分野・理解度で絞った論点の一覧を、指定した並びで返す
    wire:
      method: GET
      path: /api/topics
      success: 200
    request:
      type: object
      properties:
        field: { type: string }
        middleNo: { type: integer }
        status: { type: string, description: "理解度の番号をカンマ区切りで並べる。1〜3 以外の値は無視される" }
        sort: { type: string, enum: [frequency, name, recommended], default: frequency }
        limit: { type: integer, minimum: 1, maximum: 500, default: 200 }
    response:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            type: object
            required: [id, term, subtitle, questionCount, status, field, middle, itemName, isNew, sortOrder, round, roundLabel, tier]
            properties:
              id: { type: integer }
              term: { type: string, description: "論点の名前。副題を含まない" }
              subtitle: { type: [string, "null"], minLength: 1, description: "論点の名前に添える副題。投入データに副題が無い論点（資格対策の論点を含む）では null" }
              questionCount: { type: integer, minimum: 0 }
              status: { type: [integer, "null"], enum: [1, 2, 3, null] }
              field: { type: string }
              middle: { type: string }
              itemName: { type: string }
              isNew: { type: integer, enum: [0, 1] }
              sortOrder: { type: [integer, "null"], description: "ロードマップ型の学ぶ順。資格対策では null" }
              round: { type: [string, "null"], minLength: 1, description: "ロードマップ型で論点が属する回。UC-008 の listExams の exam と同じ値で、補足の論点は補足の回（登録簿の extraRoundId）。学ぶ順を持たない非補足の論点と資格対策では null" }
              roundLabel: { type: [string, "null"], minLength: 1, description: "論点が属する回のラベル。章で束ねる学びでは章の名前だけ（章の番号を含まない。番号と組み合わせた見出しは登録簿の回の見出しの語が作る）。日で束ねる学びでは今の回のラベル。round が null のときは null" }
              tier: { type: [integer, "null"], minimum: 1, description: "印の段。段と語の対応は登録簿。印を持たない学びでは null" }
    errors:
      - code: UNAUTHENTICATED
        when: トークンが無い、または読めない
        wire: { status: 401 }
      - code: INVALID_INPUT
        when: 検索条件が決められた形を満たさない
        wire: { status: 400 }
    examples:
      ok:
        request: { middleNo: 12, sort: frequency, status: "1,2" }
        response:
          topics:
            - { id: 418, term: "公開鍵暗号方式", subtitle: null, questionCount: 9, status: 2, field: "テクノロジ系", middle: "セキュリティ", itemName: "暗号技術", isNew: 0, sortOrder: null, round: null, roundLabel: null, tier: null }
            - { id: 419, term: "共通鍵暗号方式", subtitle: null, questionCount: 7, status: 1, field: "テクノロジ系", middle: "セキュリティ", itemName: "暗号技術", isNew: 0, sortOrder: null, round: null, roundLabel: null, tier: null }
      invalidLimit:
        request: { middleNo: 12, limit: 0 }
        error: INVALID_INPUT
      unauthenticated:
        request: { authorization: "", middleNo: 12 }
        error: UNAUTHENTICATED
      unauthenticatedBeforeInvalidLimit:
        request: { authorization: "", middleNo: 12, limit: 0 }
        error: UNAUTHENTICATED

  getTopicDetail:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 論点の教材と、紐づく過去問と、同じ小項目の他の論点を返す
    wire:
      method: GET
      path: /api/topics/{id}
      success: 200
    request:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    response:
      type: object
      required: [topic, questions, siblings, nextTopic, neighbors]
      properties:
        topic:
          type: object
          required: [id, term, subtitle, explanation, detail, questionCount, isNew, status, field, major, middle, middleNo, itemName, tier]
          properties:
            id: { type: integer }
            term: { type: string, description: "論点の名前。副題を含まない" }
            subtitle: { type: [string, "null"], minLength: 1, description: "論点の名前に添える副題。投入データに副題が無い論点（資格対策の論点を含む）では null" }
            explanation: { type: [string, "null"] }
            detail: { type: [string, "null"] }
            questionCount: { type: integer, minimum: 0 }
            isNew: { type: integer, enum: [0, 1] }
            status: { type: [integer, "null"], enum: [1, 2, 3, null] }
            field: { type: string }
            major: { type: string }
            middle: { type: string }
            middleNo: { type: integer }
            itemName: { type: string }
            tier: { type: [integer, "null"], minimum: 1, description: "印の段。段と語の対応は登録簿。印を持たない学びでは null" }
        questions:
          type: array
          items: { $ref: "#/schemas/TopicQuestion" }
        siblings:
          type: array
          items:
            type: object
            required: [id, term, questionCount]
            properties:
              id: { type: integer }
              term: { type: string }
              questionCount: { type: integer, minimum: 0 }
        nextTopic:
          type: [object, "null"]
          required: [id, term, questionCount]
          properties:
            id: { type: integer }
            term: { type: string }
            questionCount: { type: integer, minimum: 0 }
        neighbors:
          type: [object, "null"]
          description: "ロードマップ型の学ぶ順の前後。資格対策では null"
          required: [prev, next]
          properties:
            prev: { type: [object, "null"] }
            next: { type: [object, "null"] }
    errors:
      - code: UNAUTHENTICATED
        when: トークンが無い、または読めない
        wire: { status: 401 }
      - code: INVALID_INPUT
        when: 論点の ID が整数として読めない
        wire: { status: 400 }
      - code: NOT_FOUND
        when: その ID の論点が無い
        wire: { status: 404 }
    examples:
      ok:
        request: { id: 418 }
        response:
          topic: { id: 418, term: "公開鍵暗号方式", subtitle: null, explanation: "暗号化する鍵と復号する鍵を分け、暗号化する側の鍵を公開してよい方式。", detail: null, questionCount: 9, isNew: 0, status: 2, field: "テクノロジ系", major: "技術要素", middle: "セキュリティ", middleNo: 12, itemName: "暗号技術", tier: null }
          questions:
            - { id: "2018h30a-38", number: 38, examLabel: "平成30年度秋期", text: "公開鍵暗号方式を用いて送信者が受信者宛てのメッセージを暗号化するとき、暗号化に使う鍵はどれか。", choices: { "ア": "受信者の公開鍵", "イ": "受信者の秘密鍵", "ウ": "送信者の公開鍵", "エ": "送信者の秘密鍵" }, answer: "ア", hasFigure: 0, figureDescription: null, figureImage: null, citation: "平成30年度秋期 問38", modified: 0, timesAsked: 2, otherCitations: ["平成28年度春期 問40"], explanation: { correctReason: "正解。公開鍵暗号方式では、受信者だけが持つ秘密鍵でしか復号できないようにするため、受信者の公開鍵で暗号化する。", choices: [{ label: "ア", term: null, note: "正解。受信者の公開鍵で暗号化する。" }, { label: "イ", term: "秘密鍵", note: "本人だけが持ち、復号や署名に使う鍵。" }] } }
          siblings:
            - { id: 419, term: "共通鍵暗号方式", questionCount: 7 }
          nextTopic: { id: 421, term: "ディジタル署名", questionCount: 6 }
          neighbors: null
      invalidIdBeforeNotFound:
        request: { id: "abc" }
        error: INVALID_INPUT
      notFound:
        request: { id: 999999 }
        error: NOT_FOUND
      unauthenticatedBeforeInvalidId:
        request: { authorization: "", id: "abc" }
        error: UNAUTHENTICATED

schemas:
  TopicQuestion:
    type: object
    required: [id, number, examLabel, text, choices, answer, hasFigure, figureDescription, figureImage, citation, modified, timesAsked, otherCitations, explanation]
    properties:
      id: { type: string }
      number: { type: integer, minimum: 1 }
      examLabel: { type: string }
      text: { type: string }
      choices:
        type: object
        description: "記号から選択肢の本文への対応"
        additionalProperties: { type: string }
      answer: { type: string, description: "正解の記号" }
      hasFigure: { type: integer, enum: [0, 1] }
      figureDescription: { type: [string, "null"] }
      figureImage: { type: [string, "null"], description: "配信物の図の画像のパス" }
      citation: { type: string }
      modified: { type: integer, enum: [0, 1] }
      timesAsked: { type: integer, minimum: 1 }
      otherCitations: { type: array, items: { type: string } }
      explanation:
        type: [object, "null"]
        required: [correctReason, choices]
        properties:
          correctReason: { type: string }
          choices:
            type: array
            items:
              type: object
              required: [label, term, note]
              properties:
                label: { type: string }
                term: { type: [string, "null"] }
                note: { type: string }
