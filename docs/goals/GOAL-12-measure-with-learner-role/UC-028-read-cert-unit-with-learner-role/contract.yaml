  readReadingRegistry:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 登録簿から 1 つの学びがロードマップ型かを読む
    request:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z]+$", description: 学びの key（data の最後の段） }
    response:
      type: object
      required: [roadmap]
      properties:
        roadmap: { type: boolean, description: ロードマップ型の学びか }
    errors:
      - code: NOT_FOUND
        when: 登録簿に無い学び
    examples:
      ok:
        request: { key: ip }
        response: { roadmap: false }
      roadmap:
        request: { key: eng }
        response: { roadmap: true }
      missing:
        request: { key: zzz }
        error: NOT_FOUND

  readReadingUnitPlan:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学びの置き場から 1 単元の単元の構成を読む（形の正本は単元の構成の門の契約。ここは読み物が使う欄だけ）
    request:
      type: object
      required: [data, unit]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?data/[a-z]+$" }
        unit: { type: string, pattern: "^[0-9]{2}$" }
    response:
      type: object
      required: [overview, groups, prerequisites]
      properties:
        overview: { type: string, minLength: 1 }
        groups:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, description, topics]
            properties:
              name: { type: string, minLength: 1 }
              description: { type: string, minLength: 1 }
              topics: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        prerequisites: { type: object, description: 論点の ID → 前提の論点の ID の並び, additionalProperties: { type: array, items: { type: integer, minimum: 1 } } }
    errors:
      - code: NOT_FOUND
        when: その単元の構成のファイルが無い
      - code: INVALID_INPUT
        when: 単元の構成として読めない
    examples:
      ok:
        request: { data: data/ip, unit: "21" }
        response: { overview: データを表の形で持ち、キーの値で表どうしをつなぐ関係データベースの仕組みを学びます。表とキーの土台、重複を生まない表の設計、表から必要なデータを取り出す操作、同時利用と障害に備えるトランザクションの順に進みます。正規化の目的の「一貫性」と ACID 特性の「一貫性」は別の意味です。, groups: [{ name: 表とキー, description: データを行と列の表で持ち、主キーで行を見分け、外部キーで表どうしをつなぐ土台を扱います。, topics: [369, 278, 32] }], prerequisites: { "278": [369] } }
      missing:
        request: { data: data/ip, unit: "99" }
        error: NOT_FOUND
      unreadable:
        request: { data: tests/fixtures/unit-reading/unit-plan-unreadable/data/ip, unit: "21" }
        error: INVALID_INPUT

  readReadingTopics:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学びの置き場の論点の一覧から、論点の名前と出題頻度を読む
    request:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            type: object
            required: [id, term, question_count]
            properties:
              id: { type: integer, minimum: 1 }
              term: { type: string, minLength: 1 }
              question_count: { type: integer, minimum: 0 }
    errors:
      - code: INVALID_INPUT
        when: 論点の一覧として読めない
    examples:
      ok:
        request: { data: data/ip }
        response: { topics: [{ id: 369, term: 関係データベース, question_count: 3 }] }
      unreadable:
        request: { data: tests/fixtures/unit-reading/topics-unreadable/data/ip }
        error: INVALID_INPUT

  readReadingDeliveredBody:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 資格対策の学びの配る本文を、投入と同じ選び方で論点ごとに教材の世代から選んで、選んだ世代と共に読む
    request:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [materials]
      properties:
        materials:
          type: array
          items:
            type: object
            required: [topic_id, explanation, detail, generation]
            properties:
              topic_id: { type: integer, minimum: 1 }
              explanation: { type: string, minLength: 1 }
              detail: { type: string, minLength: 1, description: 出典の節を含む。前の世代から選んだ論点は図の行を含む }
              generation: { type: string, pattern: "^materials(_v[0-9]+)?$" }
    errors:
      - code: INVALID_INPUT
        when: 教材の世代のファイルが JSON として読めないか、topic_id の無い行がある
    examples:
      ok:
        request: { data: data/ip }
        response: { materials: [{ topic_id: 369, explanation: "**関係データベース**は…", detail: "### 表・レコード・フィールド\n…", generation: materials_v4 }] }
      unreadable:
        request: { data: tests/fixtures/unit-reading/materials-unreadable/data/ip }
        error: INVALID_INPUT

  readReadingGlossary:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 投入が組み立てるのと同じ用語集を、学びの置き場の用語集の元から組み立てて読む
    request:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [terms]
      properties:
        terms: { type: array, description: 用語集の正式な表記, items: { type: string, minLength: 1 } }
    errors:
      - code: INVALID_INPUT
        when: 用語集の元のファイルが読めない
    examples:
      ok:
        request: { data: data/ip }
        response: { terms: [関係データベース, 主キー] }
      unreadable:
        request: { data: tests/fixtures/unit-reading/glossary-unreadable/data/ip }
        error: INVALID_INPUT

  readReadingFigureSpec:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 1 論点の図の仕様から、図の番号・差し込み位置・説明文を読む（形の正本は図の仕様書）
    request:
      type: object
      required: [data, topic_id]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?data/[a-z]+$" }
        topic_id: { type: integer, minimum: 1 }
    response:
      type: object
      required: [figures]
      properties:
        figures:
          type: array
          description: 図の仕様の無い論点は空
          items:
            type: object
            required: [id, after, caption]
            properties:
              id: { type: integer, minimum: 1 }
              after: { type: string, minLength: 1 }
              caption: { type: string, minLength: 1 }
    errors:
      - code: INVALID_INPUT
        when: 図の仕様として読めない
    examples:
      ok:
        request: { data: data/ip, topic_id: 369 }
        response: { figures: [{ id: 1, after: "### 表・レコード・フィールド", caption: 外から内へ単位が細かくなる入れ子です。データベースは表の、表はレコードの、レコードはフィールドの集まりです。 }, { id: 2, after: "### 表どうしを項目の値でつなぐ", caption: 左が受注表の行、右が顧客表の行です。同じ顧客番号の値で結ぶので、氏名と住所は顧客表に 1 回だけ書けば済みます。 }] }
      none:
        request: { data: data/ip, topic_id: 15 }
        response: { figures: [] }
      unreadable:
        request: { data: tests/fixtures/unit-reading/figure-spec-unreadable/data/ip, topic_id: 369 }
        error: INVALID_INPUT

  readReadingFigure:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 図の参照先が指す画像を、配信の置き場から読む
    request:
      type: object
      required: [src]
      additionalProperties: false
      properties:
        src: { $ref: "../../../_shared/components.yaml#/schemas/MaterialFigureSrc" }
        root: { type: string, pattern: "^tests/fixtures/unit-reading/[a-z0-9-]+$", description: 置き場の根。リポジトリのときは持たない }
    response:
      type: object
      required: [file]
      properties:
        file: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?public/figures/materials/", description: 置き場の根の public の下の、src と同じパス }
    errors:
      - code: NOT_FOUND
        when: 画像が置き場所に無い
    examples:
      ok:
        request: { src: /figures/materials/ip/369-1.svg }
        response: { file: public/figures/materials/ip/369-1.svg }
      missing:
        request: { src: /figures/materials/ip/999-9.svg }
        error: NOT_FOUND

  writeUnitReading:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 出力先に単元の読み物（reading.md）を書く
    request:
      type: object
      required: [out, body]
      additionalProperties: false
      properties:
        out: { type: string, minLength: 1 }
        body: { type: string, minLength: 1, description: 単元の読み物の全文。押すと説明が出る語の印は語の直後の ※。図は出力先の中の MaterialFigurePng の置く先の PNG を指す }
    response: { type: object, required: [path], properties: { path: { type: string, const: reading.md } } }
    errors: []
    examples:
      ok:
        request: { out: ../unit_readings/ip_21, body: "# データベース（18 項目）\n…" }
        response: { path: reading.md }

  writeReadingFigure:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 図の画像を PNG に描いて出力先の figures/ の下に書く
    request:
      type: object
      required: [out, src, renderTimeoutSeconds]
      additionalProperties: false
      properties:
        out: { type: string, minLength: 1 }
        src: { $ref: "../../../_shared/components.yaml#/schemas/MaterialFigureSrc" }
        root: { type: string, pattern: "^tests/fixtures/unit-reading/[a-z0-9-]+$", description: 置き場の根。リポジトリのときは持たない }
        renderTimeoutSeconds: { $ref: "../../../_shared/components.yaml#/schemas/FigureRenderTimeoutSeconds" }
    response: { type: object, required: [path], properties: { path: { $ref: "../../../_shared/components.yaml#/schemas/MaterialFigurePng" } } }
    errors:
      - code: INTERNAL
        when: 図を PNG に描けない
    examples:
      notDrawable:
        request: { out: ../unit_readings/figure-not-drawable, src: /figures/materials/ip/32-1.svg, root: tests/fixtures/unit-reading/figure-not-drawable, renderTimeoutSeconds: 30 }
        error: INTERNAL
      ok:
        request: { out: ../unit_readings/ip_21, src: /figures/materials/ip/369-1.svg, renderTimeoutSeconds: 30 }
        response: { path: figures/369-1.png }
