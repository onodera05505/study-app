# UC-028 の境界: 作り手が手元で呼ぶ単元の読み物を作る入口と、それが読み書きするファイルの形。
# 読み方は docs/adr/ADR-0008（手元の道具の境界を local-store で読む）。
# この契約のパス（data・out）は、相対ならコマンドを呼んだ作業ディレクトリが起点。登録簿はリポジトリの src/shared/targets.json。
# 置き場の根は data/ と public/ を持つ場所で、リポジトリ（前置き無し）か、検査用の作り物 tests/fixtures/unit-reading/<名前>/ のどちらか。
#   学びの置き場はその根の data/<学びの key>、配る本文の図の画像はその根の public/figures/materials/<学びの key> の下。学びの key は data の最後の段
x-uc: UC-028
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-16

schemas:
  ReadingItem:
    type: object
    description: 単元の読み物の項目の番号ごとの論点。作り手にだけ返し、単元の読み物には項目の番号と論点の名前だけを出す
    required: [no, topic_id, term, generation]
    properties:
      no: { type: integer, minimum: 1 }
      topic_id: { type: integer, minimum: 1 }
      term: { type: string, minLength: 1, description: 論点の一覧の term }
      generation: { type: string, pattern: "^materials(_v[0-9]+)?$", description: 投入がその論点の配る本文を選んだ教材の世代 }
  FigureRef:
    type: object
    required: [topic_id, ref]
    properties:
      topic_id: { type: integer, minimum: 1 }
      ref: { $ref: "../../../_shared/components.yaml#/schemas/MaterialFigureSrc" }
  ToolError:
    type: object
    description: 入口が断ったときに返す形。当たった物は、その失敗が挙げる物の欄だけを持つ
    required: [error]
    properties:
      error:
        type: object
        required: [code, reason]
        properties:
          code: { type: string, enum: [INVALID_INPUT, NOT_FOUND, CONFLICT, INTERNAL] }
          reason: { type: string, minLength: 1 }
          arguments: { type: array, description: 契約の引数の形の外にある引数（挙げ方は BR-055）, items: { type: string, minLength: 1 } }
          unit: { type: string, pattern: "^[0-9]{2}$" }
          gateReasons: { type: array, description: 単元の構成の門の止める理由のうち、その単元に関する物, items: { type: string, minLength: 1 } }
          topics: { type: array, description: 当たった論点の ID, items: { type: integer, minimum: 1 } }
          unreadable: { type: array, description: 読めないファイル, items: { type: string } }
          figures:
            type: array
            description: 当たった図と、その図に当たった理由
            items:
              type: object
              required: [topic_id, ref]
              properties:
                topic_id: { type: integer, minimum: 1 }
                ref: { $ref: "../../../_shared/components.yaml#/schemas/MaterialFigureSrc" }
                cause: { type: string, enum: [imageMissing, headingMissing] }
          lines:
            type: array
            description: 配信の置き場の図を指す前置きを含むのに図の行の形に合わない行（BR-054）
            items:
              type: object
              required: [topic_id, line]
              properties:
                topic_id: { type: integer, minimum: 1 }
                line: { type: string, minLength: 1, description: 配る本文に書かれたままの行 }

operations:
  buildUnitReading:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 資格対策の学びの 1 単元を、利用者と同じ見え方の単元の読み物と図の画像にして出力先に作る
    request:
      type: object
      required: [data, unit, out]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/unit-reading/[a-z0-9-]+/)?data/[a-z]+$" }
        unit: { type: string, pattern: "^[0-9]{2}$", description: 単元の番号（単元の構成のファイルの名前と同じ 2 桁） }
        out: { type: string, minLength: 1, description: 単元の読み物の出力先。学びの置き場（置き場の根の data/ の下全体）の外で、無いか空の場所 }
    response:
      type: object
      required: [reading, figures, items]
      properties:
        reading: { type: string, const: reading.md, description: 出力先の中の単元の読み物 }
        figures: { type: array, description: 図の画像を PNG に描いた物, items: { $ref: "../../../_shared/components.yaml#/schemas/MaterialFigurePng" } }
        items: { type: array, minItems: 1, items: { $ref: "#/schemas/ReadingItem" } }
    errors:
      - code: INVALID_INPUT
        when: 引数が契約の形の外
      - code: INVALID_INPUT
        when: 登録簿に無い学びか、ロードマップ型の学び
      - code: INVALID_INPUT
        when: 出力先が学びの置き場の中
      - code: CONFLICT
        when: 出力先に中身がある
      - code: NOT_FOUND
        when: 単元が無いか、単元の構成を持たない
      - code: INVALID_INPUT
        when: 読むファイルが契約の形として読めない
      - code: INVALID_INPUT
        when: 単元の構成が門の止める理由に当たる
      - code: NOT_FOUND
        when: 配る本文の無い論点がある
      - code: CONFLICT
        when: 書き直した世代と前の世代が単元の中で混ざる
      - code: INVALID_INPUT
        when: 図の置き場を指すのに図の行の形に合わない行がある
      - code: NOT_FOUND
        when: 図の画像か差し込み位置の見出しが無い
      - code: INVALID_INPUT
        when: 同じ PNG の名前になる図が 2 つ以上ある
      - code: INTERNAL
        when: 図を PNG に描けない
      - code: CONFLICT
        when: 作る間に同じ出力先に書かれた
    examples:
      ok:
        request: { data: data/ip, unit: "21", out: ../unit_readings/ip_21 }
        response:
          reading: reading.md
          figures: [figures/369-1.png, figures/369-2.png, figures/278-1.png, figures/278-2.png, figures/32-1.png, figures/32-2.png, figures/193-1.png, figures/33-1.png, figures/192-1.png, figures/192-2.png, figures/196-1.png, figures/196-2.png, figures/195-1.png, figures/440-1.png, figures/34-1.png, figures/34-2.png, figures/518-2.png, figures/372-1.png, figures/393-1.png, figures/393-2.png, figures/197-1.png, figures/197-2.png, figures/198-1.png, figures/368-1.png]
          items:
            - { no: 1, topic_id: 369, term: 関係データベース, generation: materials_v4 }
            - { no: 2, topic_id: 278, term: 主キー, generation: materials_v4 }
            - { no: 3, topic_id: 32, term: 外部キー, generation: materials_v4 }
            - { no: 4, topic_id: 193, term: データ分析, generation: materials_v4 }
            - { no: 5, topic_id: 33, term: 正規化, generation: materials_v4 }
            - { no: 6, topic_id: 192, term: インデックス, generation: materials_v4 }
            - { no: 7, topic_id: 196, term: 選択・結合, generation: materials_v4 }
            - { no: 8, topic_id: 371, term: 射影, generation: materials_v4 }
            - { no: 9, topic_id: 195, term: データの抽出, generation: materials_v4 }
            - { no: 10, topic_id: 440, term: 集合演算, generation: materials_v4 }
            - { no: 11, topic_id: 478, term: SQL, generation: materials_v4 }
            - { no: 12, topic_id: 34, term: トランザクション, generation: materials_v4 }
            - { no: 13, topic_id: 518, term: バックワードリカバリ（ロールバック）, generation: materials_v4 }
            - { no: 14, topic_id: 372, term: ACID 特性, generation: materials_v4 }
            - { no: 15, topic_id: 393, term: 排他制御, generation: materials_v4 }
            - { no: 16, topic_id: 197, term: チェックポイント, generation: materials_v4 }
            - { no: 17, topic_id: 198, term: バックアップ, generation: materials_v4 }
            - { no: 18, topic_id: 368, term: DBMS, generation: materials_v4 }
      badArguments:
        request: { data: data/ip, unit: "1", out: "" }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [unit, out] } }
      unknownLearning:
        request: { data: data/zzz, unit: "01", out: ../unit_readings/zzz_01 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 登録簿に無い学び } }
      roadmapLearning:
        request: { data: data/eng, unit: "01", out: ../unit_readings/eng_01 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: ロードマップ型の学び } }
      outInsideData:
        request: { data: data/ip, unit: "21", out: data/ip/reading_21 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 出力先が学びの置き場の中 } }
      outInsideOtherLearning:
        request: { data: data/ip, unit: "21", out: data/ap/reading_21 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 出力先が学びの置き場の中 } }
      outNotEmpty:
        request: { data: data/ip, unit: "21", out: docs }
        error: CONFLICT
        response: { error: { code: CONFLICT, reason: 出力先に中身がある } }
      unitMissing:
        request: { data: data/ip, unit: "99", out: ../unit_readings/ip_99 }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 単元が無いか、単元の構成を持たない, unit: "99" } }
      materialsUnreadable:
        request: { data: tests/fixtures/unit-reading/materials-unreadable/data/ip, unit: "21", out: ../unit_readings/materials-unreadable }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 読むファイルが契約の形として読めない, unreadable: [tests/fixtures/unit-reading/materials-unreadable/data/ip/materials_v4/21-2.json] } }
      unitPlanGateStops:
        request: { data: tests/fixtures/unit-reading/unit-plan-gate-stops/data/ip, unit: "21", out: ../unit_readings/unit-plan-gate-stops }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 単元の構成が門の止める理由に当たる, unit: "21", gateReasons: [前提の論点 999 が学びに無い] } }
      bodyMissing:
        request: { data: tests/fixtures/unit-reading/body-missing/data/ip, unit: "21", out: ../unit_readings/body-missing }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 配る本文の無い論点がある, topics: [478] } }
      mixedGenerations:
        request: { data: tests/fixtures/unit-reading/mixed-generations/data/ip, unit: "21", out: ../unit_readings/mixed-generations }
        error: CONFLICT
        response: { error: { code: CONFLICT, reason: 書き直した世代と前の世代が単元の中で混ざる, topics: [34, 518, 372, 393, 197, 198, 368] } }
      figureMissing:
        request: { data: tests/fixtures/unit-reading/figure-missing/data/ip, unit: "21", out: ../unit_readings/figure-missing }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 図の画像か差し込み位置の見出しが無い, figures: [{ topic_id: 369, ref: /figures/materials/ip/369-2.svg, cause: imageMissing }] } }
      figureHeadingMissing:
        request: { data: tests/fixtures/unit-reading/figure-heading-missing/data/ip, unit: "21", out: ../unit_readings/figure-heading-missing }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 図の画像か差し込み位置の見出しが無い, figures: [{ topic_id: 369, ref: /figures/materials/ip/369-1.svg, cause: headingMissing }] } }
      figureNameCollision:
        request: { data: tests/fixtures/unit-reading/figure-name-collision/data/ip, unit: "21", out: ../unit_readings/figure-name-collision }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 同じ PNG の名前になる図が 2 つ以上ある, figures: [{ topic_id: 369, ref: /figures/materials/ip/369-1.svg }, { topic_id: 278, ref: /figures/materials/ip/369-1.png }] } }
      figureNotDrawable:
        request: { data: tests/fixtures/unit-reading/figure-not-drawable/data/ip, unit: "21", out: ../unit_readings/figure-not-drawable }
        error: INTERNAL
        response: { error: { code: INTERNAL, reason: 図を PNG に描けない, figures: [{ topic_id: 32, ref: /figures/materials/ip/32-1.svg }] } }
      abbreviatedArgument:
        request: { data: data/ip, unit: "21", o: ../unit_readings/ip_21 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [out, o] } }
      figureLineMalformed:
