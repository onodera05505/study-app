        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 図の置き場を指すのに図の行の形に合わない行がある, lines: [{ topic_id: 369, line: "![図](/figures/materials/ip/../../zz-9.svg)" }, { topic_id: 278, line: "![図](/figures/materials/IP/369-9.svg)" }, { topic_id: 32, line: "![図](/figures/materials/369-9.svg)" }] } }
      mixedBeforeFigureLineMalformed:
        request: { data: tests/fixtures/unit-reading/mixed-and-figure-line-malformed/data/ip, unit: "21", out: ../unit_readings/mixed-and-figure-line-malformed }
        error: CONFLICT
        response: { error: { code: CONFLICT, reason: 書き直した世代と前の世代が単元の中で混ざる, topics: [34, 518, 372, 393, 197, 198, 368] } }
      figureLineMalformedBeforeFigureMissing:
        request: { data: tests/fixtures/unit-reading/figure-line-malformed-and-figure-missing/data/ip, unit: "21", out: ../unit_readings/figure-line-malformed-and-figure-missing }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 図の置き場を指すのに図の行の形に合わない行がある, lines: [{ topic_id: 369, line: "![図](/figures/materials/IP/369-9.svg)" }] } }
      badArgumentsBeforeRoadmap:
        request: { data: data/eng, unit: "1", out: ../unit_readings/eng_1 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [unit] } }
      roadmapBeforeOutInside:
        request: { data: data/eng, unit: "01", out: data/eng/reading_01 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: ロードマップ型の学び } }
      outInsideBeforeOutNotEmpty:
        request: { data: data/ip, unit: "21", out: data/ip }
