# UC-019 の境界: 作り手が手元で呼ぶパックを作る入口と採点の入口、それらが読み書きするファイルの形。
# 読み方は docs/adr/ADR-0008（手元の道具の境界を local-store で読む）。
# この契約のパス（data・out・answers・explain・path・file）は、相対ならコマンドを呼んだ作業ディレクトリが起点。登録簿はリポジトリの src/shared/targets.json。
# 置き場の根は data/ と public/ を持つ場所で、リポジトリ（前置き無し）か、検査用の作り物 tests/fixtures/learner-pack/<名前>/ のどちらか。
#   学びの置き場はその根の data/<学びの key>、配る本文の図の画像はその根の public/figures/materials/<学びの key> の下。学びの key は data の最後の段
x-uc: UC-019
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-08

schemas:
  PackSnapshot:
    type: object
    description: その周のパックの写し。置き場は学びの置き場の eval の下の、pack_cycle_ に周の番号を続けた名前の json で、周ごとに 1 つ
    required: [cycle, units, questions]
    properties:
      cycle: { type: integer, minimum: 1 }
      units:
        type: array
        description: パックに出した全単位。周の結果の per_unit の鍵と、stuck_units・overconfident_units の term はここから取る
        items:
          type: object
          required: [order, topic_id, term, field]
          properties:
            order: { type: integer, minimum: 1 }
            topic_id: { type: integer, minimum: 1, description: パックの一覧と単位のファイルに出す単位の ID }
            term: { type: string, minLength: 1 }
            field: { type: string, minLength: 1 }
      questions:
        type: array
        description: パックの確認問題に出した順。採点・集計・記録のずれの疑いはこれで行う
        items:
          type: object
          required: [qid, topic_id, tests_goal, field, answer]
          properties:
            qid: { type: string, minLength: 1 }
            topic_id: { type: integer, minimum: 1 }
            tests_goal: { type: integer, minimum: 1 }
            field: { type: string, minLength: 1 }
            answer: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
  LearnerAnswers:
    type: object
    description: 学習者役が書いて返す答えと自己申告の形。パックの確認問題のファイルに書き方として出す
    required: [answers, units]
    properties:
      answers: { type: object, description: 問題の識別子 → 選んだ答え, additionalProperties: { type: string } }
      units:
        type: array
        items:
          type: object
          required: [topic_id]
          properties:
            topic_id: { type: integer, minimum: 1, description: パックに出した単位の ID。別名を持たない }
            minutes: { type: number, minimum: 0 }
            understood: { type: integer, enum: [1, 2, 3], description: 理解の段。3 人に説明できる・2 分かった気がする・1 分からなかった }
            understanding: { type: integer, enum: [1, 2, 3], description: understood の別名 }
            understand: { type: integer, enum: [1, 2, 3], description: understood の別名 }
            confusing: { type: string }
            confusing_with: { type: string, description: confusing の別名 }
            unknown_terms: { type: array, items: { type: string } }
            unclear_terms: { type: array, items: { type: string }, description: unknown_terms の別名 }
            unexplained_terms: { type: array, items: { type: string }, description: unknown_terms の別名 }
      overall: { type: object }
  ReturnedLearnerAnswers:
    type: object
    description: 学習者役が返したファイルを読んだままの形。行の中身の条件は gradeLearnerAnswers の最後の errors（自己申告の読めない行）だけが見る
    required: [answers, units]
    properties:
      answers: { type: object, additionalProperties: { type: string } }
      units: { type: array, items: { type: object, description: 欄の有無と型を問わない 1 行 } }
      overall: { type: object }
  ToolError:
    type: object
    description: 入口が断ったときに返す形。当たった物は、その失敗が挙げる物の欄だけを持つ
    required: [error]
    properties:
      error:
        type: object
        required: [code, reason]
        properties:
          code: { type: string, enum: [INVALID_INPUT, NOT_FOUND, CONFLICT, INTERNAL] }
          reason: { type: string, minLength: 1 }
          units: { type: array, description: 配る本文の無い単位の ID, items: { type: integer, minimum: 1 } }
          figures:
            type: array
            description: 当たった図（置き場所に無い・PNG に描けない・同じ PNG の名前になる）。属する単位の ID と本文の図の行の参照先の組
            items:
              type: object
              required: [unit, ref]
              properties:
                unit: { type: integer, minimum: 1 }
                ref: { type: string, minLength: 1 }
          roadmapRows:
            type: array
            description: ロードマップの読めない行。何番目の行か、欠けるか型の違う欄の名前
            items:
              type: object
              required: [index, fields]
              properties:
                index: { type: integer, minimum: 0 }
                fields: { type: array, minItems: 1, items: { type: string } }
          arguments: { type: array, description: 契約の引数の形の外にある引数の名前, items: { type: string } }
          qids: { type: array, description: 選択肢の外の答えを書いた問題, items: { type: string } }
          placeholders: { type: array, description: 学習者役への指示の雛形の埋まらない差し込みの名前, items: { type: string, minLength: 1 } }
          unreadable: { type: array, description: 無いか読めないファイル, items: { type: string } }
          rows:
            type: array
            description: 自己申告の読めない行。当たった行をすべて、当たった条件とともに持つ
            items:
              type: object
              required: [index, conditions]
              properties:
                index: { type: integer, minimum: 0, description: units の中の何番目の行か }
                conditions: { type: array, minItems: 1, items: { type: string, enum: [missingId, idNotInteger, idNotInSnapshot, duplicateId, aliasConflict, valueOutOfRange] } }
  UnitRef:
    type: object
    required: [topic_id, term]
    properties:
      topic_id: { type: integer, minimum: 1 }
      term: { type: string, description: 写しの units の term }
      confusing: { type: string }
  CycleResult:
    type: object
    description: 周の結果。置き場は学びの置き場の eval の下の、cycle_ に周の番号を続けた名前の json
    required: [cycle, score, rate, by_goal, by_field, per_unit, reported_units, avg_understood, stuck_units, overconfident_units, unknown_terms, shift_suspect, shift_window, wrong, changed_answers]
    properties:
      cycle: { type: integer, minimum: 1 }
      score: { type: string, pattern: "^[0-9]+/[0-9]+$" }
      rate: { type: number, minimum: 0, maximum: 1 }
      by_goal: { type: object, description: 到達基準の番号 → 正答, additionalProperties: { type: string, pattern: "^[0-9]+/[0-9]+$" } }
      by_field: { type: object, description: 分野 → 正答, additionalProperties: { type: string, pattern: "^[0-9]+/[0-9]+$" } }
      per_unit:
        type: object
        description: 写しの units の全単位を、単位の ID を鍵に 1 つずつ持つ（自己申告や問題の無い単位も含む）
        additionalProperties:
          type: object
          required: [term, field, correct, total, understood]
          properties:
            term: { type: string }
            field: { type: string }
            correct: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
            understood: { type: [integer, "null"], enum: [1, 2, 3, null], description: 理解の段を書かなかった単位は null }
            confusing: { type: string }
            unknown_terms: { type: array, items: { type: string } }
            minutes: { type: [number, "null"] }
      reported_units: { type: integer, minimum: 0, description: 理解の段を書いた単位の数。avg_understood の分母 }
      avg_understood: { type: number, minimum: 0, maximum: 3, description: 理解の段を書いた単位の段の平均。1 つも無いときは 0 }
      stuck_units: { type: array, items: { $ref: "#/schemas/UnitRef" } }
      overconfident_units: { type: array, items: { $ref: "#/schemas/UnitRef" } }
      unknown_terms: { type: array, items: { type: string } }
      shift_suspect: { type: array, description: 記録のずれの疑いの窓に入った問題, items: { type: string } }
      shift_window: { type: integer, const: 3, description: 写しの questions の並びで続けて見る問題の数。比べるのは窓の中の選んだ答えと正解だけ }
      wrong: { type: array, items: { type: object, required: [qid, answer], properties: { qid: { type: string }, picked: { type: [string, "null"] }, answer: { type: string } } } }
      changed_answers: { type: array, description: 写しと今とで正解が変わった問題, items: { type: string } }
      explain:
        type: object
        required: [rate, can_explain, n]
        properties:
          rate: { type: number, minimum: 0, maximum: 1, description: 得点の合計 ÷（2 × 語の数） }
          can_explain: { type: integer, minimum: 0, description: 得点が 2 の語の数 }
          n: { type: integer, minimum: 0, description: 採点した語の数 }
      delta_rate: { type: number, description: その周より小さい番号の周の結果のうち最も大きい番号の物との差。無ければ持たない }
      delta_understood: { type: number }

operations:
  buildLearnerPack:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 周の番号を付けて学習者役のパックを作り、その周のパックの写しを残す
    request:
      type: object
      required: [data, cycle, out]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
        cycle: { type: integer, minimum: 1 }
        out: { type: string, minLength: 1, description: パックの出力先。学びの置き場（置き場の根の data/ の下全体）の外で、無いか空の場所 }
    response:
      type: object
      required: [snapshotPath, snapshot, files]
      properties:
        snapshotPath: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+/eval/pack_cycle_[0-9]+\\.json$" }
        snapshot: { $ref: "#/schemas/PackSnapshot" }
        files:
          type: object
          description: パックの中のファイル。中身の形は writePack* の各操作
          required: [roadmap, units, quiz, figures]
          properties:
            roadmap: { type: string, const: roadmap.md }
            units: { type: array, items: { type: string, pattern: "^units/[0-9]{2,}_.+\\.md$" } }
            quiz: { type: string, const: quiz.md }
            explain: { type: string, const: explain.md, description: 説明テストの語の一覧を持つ学びだけ }
            figures: { type: array, description: 本文の図を描いた PNG。元の置き場のサブパスを保ち拡張子だけ .png にする, items: { type: string, pattern: "^figures/.+\\.png$" } }
    errors:
      - code: INVALID_INPUT
        when: 引数が契約の形の外
      - code: INVALID_INPUT
        when: 登録簿に無い学びか、ロードマップを持たない学び
      - code: INVALID_INPUT
        when: 出力先が学びの置き場の中
      - code: CONFLICT
        when: 出力先に中身がある
      - code: CONFLICT
        when: その周の写しか周の結果がある
      - code: NOT_FOUND
        when: 今の確認問題が無い
      - code: INVALID_INPUT
        when: 今の確認問題が読めない
      - code: INVALID_INPUT
        when: 説明テストの語の一覧が読めない
      - code: INVALID_INPUT
        when: ロードマップに欠けてはならない欄が無いか型の違う行がある
      - code: INVALID_INPUT
        when: 配る本文を選ぶ教材の世代のファイルが読めない
      - code: NOT_FOUND
        when: 配る本文の無い単位がある
      - code: NOT_FOUND
        when: 配る本文が指す図の画像が無い
      - code: INVALID_INPUT
        when: 同じ PNG の名前になる図が 2 つ以上ある
      - code: INTERNAL
        when: 図が XML として整わないか、描く待ち時間の上限のうちに PNG に描けない
      - code: CONFLICT
        when: 作る間に同じ周の写しが書かれた
    examples:
      ok:
        request: { data: data/eng, cycle: 8, out: ../learner_packs/eng_c8 }
        response:
          snapshotPath: data/eng/eval/pack_cycle_8.json
          snapshot: { cycle: 8, units: [{ order: 1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み }], questions: [{ qid: t1-1, topic_id: 1, tests_goal: 1, field: コンピュータの仕組み, answer: イ }, { qid: t1-2, topic_id: 1, tests_goal: 1, field: コンピュータの仕組み, answer: エ }] }
          files: { roadmap: roadmap.md, units: ["units/01_コンピュータの_5_つの働き（入力・記憶・演算・制御・出力）.md"], quiz: quiz.md, explain: explain.md, figures: [figures/1-1.png] }
      badArguments:
        request: { data: data/eng, cycle: 0, out: "" }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [cycle, out] } }
      notRoadmap:
        request: { data: data/ip, cycle: 1, out: ../learner_packs/ip_c1 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: ロードマップを持たない学び } }
      outInsideData:
        request: { data: data/eng, cycle: 8, out: data/eng/pack_c8 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 出力先が学びの置き場の中 } }
      outInsideOtherLearning:
        request: { data: data/eng, cycle: 8, out: data/itc/pack }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 出力先が学びの置き場の中 } }
      outNotEmpty:
        request: { data: data/eng, cycle: 8, out: docs }
        error: CONFLICT
        response: { error: { code: CONFLICT, reason: 出力先に中身がある } }
      sameCycle:
        request: { data: data/eng, cycle: 6, out: ../learner_packs/eng_c6 }
        error: CONFLICT
        response: { error: { code: CONFLICT, reason: その周の周の結果がある } }
      questionsMissing:
        request: { data: tests/fixtures/learner-pack/questions-missing/data/itc, cycle: 1, out: ../learner_packs/questions-missing }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 今の確認問題が無い } }
      questionsUnreadable:
        request: { data: tests/fixtures/learner-pack/questions-unreadable/data/itc, cycle: 1, out: ../learner_packs/questions-unreadable }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 今の確認問題が読めない, unreadable: [tests/fixtures/learner-pack/questions-unreadable/data/itc/roadmap_questions/bundle_01.json] } }
      explainTermsUnreadable:
        request: { data: tests/fixtures/learner-pack/explain-terms-unreadable/data/eng, cycle: 1, out: ../learner_packs/explain-terms-unreadable }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 説明テストの語の一覧が読めない, unreadable: [tests/fixtures/learner-pack/explain-terms-unreadable/data/eng/explain_terms.json] } }
      roadmapRowBroken:
        request: { data: tests/fixtures/learner-pack/roadmap-row-broken/data/itc, cycle: 1, out: ../learner_packs/roadmap-row-broken }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: ロードマップに欠けてはならない欄が無いか型の違う行がある, roadmapRows: [{ index: 3, fields: [topic_id] }] } }
      materialsUnreadable:
        request: { data: tests/fixtures/learner-pack/materials-unreadable/data/itc, cycle: 1, out: ../learner_packs/materials-unreadable }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 配る本文を選ぶ教材の世代のファイルが読めない, unreadable: [tests/fixtures/learner-pack/materials-unreadable/data/itc/materials_v3/bundle_02.json] } }
      bodyMissing:
        request: { data: tests/fixtures/learner-pack/body-missing/data/itc, cycle: 1, out: ../learner_packs/body-missing }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 配る本文の無い単位がある, units: [12] } }
      figureMissing:
        request: { data: tests/fixtures/learner-pack/figure-missing/data/itc, cycle: 1, out: ../learner_packs/figure-missing }
        error: NOT_FOUND
        response: { error: { code: NOT_FOUND, reason: 配る本文が指す図の画像が無い, figures: [{ unit: 12, ref: /figures/materials/itc/12-1.svg }] } }
      figureNameCollision:
        request: { data: tests/fixtures/learner-pack/figure-name-collision/data/msg, cycle: 1, out: ../learner_packs/figure-name-collision }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 同じ PNG の名前になる図が 2 つ以上ある, figures: [{ unit: 5, ref: /figures/materials/msg/5-1.svg }, { unit: 6, ref: /figures/materials/msg/5-1.png }] } }
      figureNotWellFormed:
        request: { data: tests/fixtures/learner-pack/figure-not-well-formed/data/itc, cycle: 1, out: ../learner_packs/figure-not-well-formed }
        error: INTERNAL
        response: { error: { code: INTERNAL, reason: 図が XML として整わない, figures: [{ unit: 16, ref: /figures/materials/itc/16-2.svg }] } }
      figureNotDrawable:
        request: { data: tests/fixtures/learner-pack/figure-not-drawable/data/itc, cycle: 1, out: ../learner_packs/figure-not-drawable }
        error: INTERNAL
        response: { error: { code: INTERNAL, reason: 図を PNG に描けない, figures: [{ unit: 16, ref: /figures/materials/itc/16-1.svg }] } }
      badArgumentsBeforeNotRoadmap:
        request: { data: data/ip, cycle: 0, out: ../learner_packs/ip_c0 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [cycle] } }
      notRoadmapBeforeOutInside:
        request: { data: data/ip, cycle: 1, out: data/ip/pack_c1 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: ロードマップを持たない学び } }
      outInsideBeforeSameCycle:
        request: { data: data/eng, cycle: 6, out: data/eng/pack_c6 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 出力先が学びの置き場の中 } }

  gradeLearnerAnswers:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 学習者役の答えをその周のパックの写しで採点し、周の結果を残す
    request:
      type: object
      required: [data, cycle, answers]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
        cycle: { type: integer, minimum: 1 }
        answers: { type: string, minLength: 1, description: 答えのファイル（読んだままの形は readLearnerAnswers、書き方は writePackQuiz の answerFormat） }
        explain: { type: string, minLength: 1, description: 説明テストの採点のファイル（形は readExplainGrades） }
    response: { $ref: "#/schemas/CycleResult" }
    errors:
      - code: INVALID_INPUT
        when: 引数が契約の形の外
      - code: INVALID_INPUT
        when: 登録簿に無い学びか、ロードマップを持たない学び
      - code: NOT_FOUND
        when: 今の確認問題が無い
      - code: INVALID_INPUT
        when: 今の確認問題が読めない
      - code: NOT_FOUND
        when: その周のパックの写しが無い
      - code: INVALID_INPUT
        when: その周のパックの写しが読めない
      - code: CONFLICT
        when: その周の結果が既にある
      - code: INVALID_INPUT
        when: 差を取る前の周の結果が読めない
      - code: NOT_FOUND
        when: 答えのファイルが無い
      - code: INVALID_INPUT
        when: 答えのファイルが読めないか、選択肢の外の答えがある
      - code: NOT_FOUND
        when: 説明テストの採点のファイルが無い
      - code: INVALID_INPUT
        when: 説明テストの採点のファイルが読めない
      - code: INVALID_INPUT
        when: 自己申告に読めない行がある（当たった行をすべて挙げる）
      - code: CONFLICT
        when: 採点する間に同じ周の結果が書かれた
    examples:
      ok:
        request: { data: data/eng, cycle: 8, answers: ../learner_packs/eng_c8/learner_answers.json }
        response:
          cycle: 8
          score: 3/4
          rate: 0.75
          by_goal: { "1": 3/4 }
          by_field: { コンピュータの仕組み: 3/4 }
          per_unit:
            "1": { term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み, correct: 1, total: 2, understood: 3 }
            "2": { term: CPU（命令を読んで計算する中心の部品）, field: コンピュータの仕組み, correct: 2, total: 2, understood: null, minutes: 4 }
          reported_units: 1
          avg_understood: 3
          stuck_units: []
          overconfident_units: [{ topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力） }]
          unknown_terms: []
          shift_suspect: []
          shift_window: 3
          wrong: [{ qid: t1-2, picked: イ, answer: エ }]
          changed_answers: []
      okWithExplain:
        request: { data: data/eng, cycle: 8, answers: ../learner_packs/eng_c8/learner_answers.json, explain: ../learner_packs/eng_c8/explain_grade.json }
        response:
          cycle: 8
          score: 3/4
          rate: 0.75
          by_goal: { "1": 3/4 }
          by_field: { コンピュータの仕組み: 3/4 }
          per_unit:
            "1": { term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み, correct: 1, total: 2, understood: 3 }
