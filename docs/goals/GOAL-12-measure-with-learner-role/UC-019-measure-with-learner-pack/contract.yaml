  renderLearnerInstructions:
    transport: local-store
    direction: inbound
    owned: true
    auth: none
    summary: 学びの学習者役への指示を雛形から描き出す
    request:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$", description: 学びの置き場。最後の段が登録簿の学びの key }
    response:
      type: object
      required: [path]
      properties:
        path: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+/prompts/roadmap_learner\\.md$", description: 描き出した指示。中身の形は writeLearnerInstructions }
    errors:
      - code: INVALID_INPUT
        when: 引数が契約の形の外
      - code: INVALID_INPUT
        when: 登録簿に無い学びか、ロードマップを持たない学び
      - code: INVALID_INPUT
        when: 雛形の差し込みに埋まらない物が残る
    examples:
      ok:
        request: { data: data/itc }
        response: { path: data/itc/prompts/roadmap_learner.md }
      okChapter:
        request: { data: data/eng }
        response: { path: data/eng/prompts/roadmap_learner.md }
      placeholderUnfilled:
        request: { data: tests/fixtures/learner-pack/instructions-no-days/data/itc }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 雛形の差し込みに埋まらない物が残る, placeholders: [days] } }
      badArguments:
        request: {}
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [data] } }
      unknownLearning:
        request: { data: data/zzz }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 登録簿に無い学び } }
      notRoadmap:
        request: { data: data/ip }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: ロードマップを持たない学び } }
      badArgumentsBeforeNotRoadmap:
        request: { data: data/ip, cycle: 1 }
        error: INVALID_INPUT
        response: { error: { code: INVALID_INPUT, reason: 引数が契約の形の外, arguments: [cycle] } }

  readLearnerTemplate:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学習者役への指示の雛形を読み、節の見出しと、雛形の差し込みの名前と、日で束ねる学びだけの塊の中の差し込みの名前を返す
    request:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, const: scripts/prompts/roadmap_learner.md }
    response:
      type: object
      required: [headings, placeholders, byDayPlaceholders]
      properties:
        headings: { type: array, description: 雛形の節の見出し（改訂履歴の節を含む）, items: { type: string, minLength: 1 } }
        placeholders: { type: array, description: "雛形の差し込み（{{名前}}）の名前。値は登録簿の学びの語（readRegistryLearning）と、日で束ねる学び（readRoadmap に group_by が無い）ではロードマップの days（readRoadmap）が埋め、既定値では埋めない", items: { type: string, minLength: 1 } }
        byDayPlaceholders: { type: array, description: "日で束ねる学びだけの塊（雛形で {{#byDay}} と {{/byDay}} に挟んだ文。行の中に置けて入れ子にしない）の中の差し込みの名前。日で束ねる学びでは塊の文を印を除いて出し、章で束ねる学び（readRoadmap の group_by が chapter）では塊を印ごと出さず、中の差し込みを埋めない", items: { type: string, minLength: 1 } }
    errors: []
    examples:
      ok:
        request: { path: scripts/prompts/roadmap_learner.md }
        response: { headings: ["# 学習者ロール（理解度を測るための別エージェント。開発側の情報は渡さない）", "## やること", "## 守ること", "## 改訂履歴"], placeholders: [learnerRole, days, goalVerb], byDayPlaceholders: [days] }

  readRegistryLearning:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 登録簿から 1 つの学びの種類と、学習者役への指示に差し込む学びの語を読む
    request:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z]+$", description: 学びの key（data の最後の段） }
    response:
      type: object
      required: [roadmap]
      properties:
        roadmap: { type: boolean, description: ロードマップを持つ学びか }
        roadmapSpec:
          type: object
          description: ロードマップを持つ学びだけ
          properties:
            learnerRole: { type: string, minLength: 1 }
            goalVerb: { type: string, minLength: 1 }
    errors:
      - code: NOT_FOUND
        when: 登録簿に無い学び
    examples:
      ok:
        request: { key: itc }
        response: { roadmap: true, roadmapSpec: { learnerRole: "あなたは文系の大学 3 年生です。IT の知識はスマホとレポート作成くらいで、プログラミングの経験はありません。\nIT コンサルの就活を考え始めたところで、業界の言葉は聞いたことがあっても説明できません。", goalVerb: 面接で示せる } }
      notRoadmap:
        request: { key: ip }
        response: { roadmap: false }
      missing:
        request: { key: zzz }
        error: NOT_FOUND

  readRoadmap:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: ロードマップ型の学びのロードマップ（学ぶ順の単位の並び）を読む
    request:
      type: object
      required: [data]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [units]
      properties:
        group_by: { type: string, enum: [chapter], description: 章で束ねる学びだけ。無ければ日で束ねる }
        days: { type: integer, minimum: 1, description: 学ぶ日数。日で束ねる学びだけ }
        units:
          type: array
          items:
            type: object
            required: [order, topic_id, term, field, middle, summary]
            properties:
              order: { type: integer, minimum: 1 }
              topic_id: { type: integer, minimum: 1 }
              term: { type: string, minLength: 1 }
              field: { type: string, minLength: 1 }
              middle: { type: string, minLength: 1, description: 単元 }
              summary: { type: string }
              day: { type: integer, minimum: 1 }
              round: { type: integer, minimum: 1 }
              chapter: { type: string }
    errors:
      - code: NOT_FOUND
        when: ロードマップが無い
      - code: INVALID_INPUT
        when: JSON として読めないか、units が無い（行ごとの欠けは buildLearnerPack が挙げる）
    examples:
      ok:
        request: { data: data/eng }
        response: { group_by: chapter, units: [{ order: 1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み, middle: コンピュータを形づくる部品, summary: どんなコンピュータも、受け取る・覚える・…, round: 1, chapter: コンピュータを形づくる部品 }] }
      missing:
        request: { data: data/ip }
        error: NOT_FOUND
      unreadable:
        request: { data: tests/fixtures/learner-pack/roadmap-unreadable/data/itc }
        error: INVALID_INPUT

  readRoadmapQuestions:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: ロードマップ型の学びの今の確認問題を読む（パックへ出す問題と、採点で写しと比べる今の正解）
    request:
      type: object
      required: [data]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [qid, topic_id, term, stem, choices, answer, reason, choice_notes, tests_goal]
            properties:
              qid: { type: string, minLength: 1 }
              topic_id: { type: integer, minimum: 1 }
              term: { type: string }
              stem: { type: string, minLength: 1 }
              choices: { type: object, required: ["ア", "イ", "ウ", "エ"], additionalProperties: { type: string } }
              answer: { type: string, enum: ["ア", "イ", "ウ", "エ"] }
              reason: { type: string, description: 正解の根拠。パックに出さない }
              choice_notes: { type: object, description: 選択肢ごとの説明。パックに出さない, additionalProperties: { type: string } }
              tests_goal: { type: integer, minimum: 1 }
    errors:
      - code: NOT_FOUND
        when: 確認問題が無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { data: data/eng }
        response: { questions: [{ qid: t1-1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, stem: …, choices: { "ア": …, "イ": …, "ウ": …, "エ": … }, answer: イ, reason: 制御は部品の動く順と中身を指図する働きで…, choice_notes: { "イ": 正解。どの部品がいつ動くかを決めて指図するのが制御に当たる。 }, tests_goal: 1 }] }
      missing:
        request: { data: data/ip }
        error: NOT_FOUND
      unreadable:
        request: { data: tests/fixtures/learner-pack/questions-unreadable/data/itc }
        error: INVALID_INPUT

  readExplainTerms:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 説明テストの語の一覧を読む（無い学びは説明テストを出さない）
    request:
      type: object
      required: [data]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [terms]
      properties:
        terms: { type: array, items: { type: object, required: [term], properties: { term: { type: string, minLength: 1 }, goal: { type: integer, minimum: 1 } } } }
    errors:
      - code: NOT_FOUND
        when: 語の一覧が無い
      - code: INVALID_INPUT
        when: 語の一覧が JSON として読めないか、terms が無い
    examples:
      ok:
        request: { data: data/eng }
        response: { terms: [{ term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, goal: 1 }] }
      missing:
        request: { data: data/ip }
        error: NOT_FOUND
      unreadable:
        request: { data: tests/fixtures/learner-pack/explain-terms-unreadable/data/eng }
        error: INVALID_INPUT

  readDeliveredBody:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: ロードマップ型の学びの配る本文を、投入と同じく materials・materials_v2・materials_v3 の順に読み、論点ごとに後の世代を選んで読む
    request:
      type: object
      required: [data]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
    response:
      type: object
      required: [materials]
      properties:
        materials:
          type: array
          items:
            type: object
            required: [topic_id, term, explanation, detail]
            properties:
              topic_id: { type: integer, minimum: 1 }
              term: { type: string, minLength: 1 }
              explanation: { type: string, minLength: 1 }
              detail: { type: string, minLength: 1, description: 出典の節と図の行を含む。図の行は /figures/materials/ の下の、学びの key のディレクトリにある図の画像のファイルを指す }
    errors:
      - code: NOT_FOUND
        when: 配る本文が無い
      - code: INVALID_INPUT
        when: 教材の世代のファイルが JSON として読めないか、topic_id の無い行がある
    examples:
      unreadable:
        request: { data: tests/fixtures/learner-pack/materials-unreadable/data/itc }
        error: INVALID_INPUT
      ok:
        request: { data: data/eng }
        response: { materials: [{ topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, explanation: "**コンピュータの 5 つの働き**は…", detail: "### しくみ\n![…](/figures/materials/eng/1-1.svg)\n…" }] }
      missing:
        request: { data: data/ip }
        error: NOT_FOUND

  readFigure:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 配る本文の図の行が指す画像を、配信の置き場から読む
    request:
      type: object
      required: [src]
      properties:
        src: { type: string, pattern: "^/figures/materials/[a-z]+/.+\\.(svg|png)$", description: 本文の図の行の参照先。実体は置き場の根の public の下の同じパス }
        root: { type: string, pattern: "^tests/fixtures/learner-pack/[a-z0-9-]+$", description: 置き場の根。リポジトリのときは持たない }
    response:
      type: object
      required: [file]
      properties:
        file: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?public/figures/materials/[a-z]+/.+\\.(svg|png)$" }
    errors:
      - code: NOT_FOUND
        when: 画像が置き場所に無い
    examples:
      ok:
        request: { src: /figures/materials/eng/1-1.svg }
        response: { file: public/figures/materials/eng/1-1.svg }
      okInFixture:
        request: { src: /figures/materials/itc/16-1.svg, root: tests/fixtures/learner-pack/figure-not-drawable }
        response: { file: tests/fixtures/learner-pack/figure-not-drawable/public/figures/materials/itc/16-1.svg }
      missing:
        request: { src: /figures/materials/eng/999-9.svg }
        error: NOT_FOUND

  writePackRoadmap:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: パックの一覧（roadmap.md）を書く
    request:
      type: object
      required: [out, units]
      properties:
        out: { type: string, minLength: 1 }
        units:
          type: array
          description: 学ぶ順。各行に、学習者役への指示が名指す括弧の形で単位の ID を出し、属する回を添える
          items:
            type: object
            required: [order, topic_id, term, round, summary, file]
            properties:
              order: { type: integer, minimum: 1 }
              topic_id: { type: integer, minimum: 1 }
              term: { type: string }
              round: { type: string, minLength: 1, description: 回の見出しの語（章の名前か日） }
              summary: { type: string }
              file: { type: string, pattern: "^units/[0-9]{2,}_.+\\.md$" }
    response: { type: object, required: [path], properties: { path: { type: string, const: roadmap.md } } }
    errors: []
    examples:
      ok:
        request: { out: ../learner_packs/eng_c8, units: [{ order: 1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, round: 第 1 章 コンピュータを形づくる部品, summary: どんなコンピュータも、受け取る・覚える・…, file: "units/01_コンピュータの_5_つの働き（入力・記憶・演算・制御・出力）.md" }] }
        response: { path: roadmap.md }

  writePackUnit:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 単位ごとのファイルを書く（名前・分野・単元と、配る本文の全文。図の行だけパックの中を指す）
    request:
      type: object
      required: [out, file, topic_id, term, field, middle, explanation, detail]
      additionalProperties: false
      properties:
        out: { type: string, minLength: 1 }
        file: { type: string, pattern: "^units/[0-9]{2,}_.+\\.md$" }
        topic_id: { type: integer, minimum: 1 }
        term: { type: string }
        field: { type: string }
        middle: { type: string, description: 単元 }
        explanation: { type: string, minLength: 1 }
        detail: { type: string, minLength: 1, description: 配る本文の detail。図の行だけを、../figures/ の下の、元のサブパスを保ち拡張子を .png にした画像を指すように変える }
    response: { type: object, required: [path], properties: { path: { type: string, pattern: "^units/[0-9]{2,}_.+\\.md$" } } }
    errors: []
    examples:
      ok:
        request: { out: ../learner_packs/eng_c8, file: "units/01_コンピュータの_5_つの働き（入力・記憶・演算・制御・出力）.md", topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み, middle: コンピュータを形づくる部品, explanation: "**コンピュータの 5 つの働き**は…", detail: "### しくみ\n![…](../figures/1-1.png)\n…" }
        response: { path: "units/01_コンピュータの_5_つの働き（入力・記憶・演算・制御・出力）.md" }

  writePackQuiz:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 確認問題のファイル（quiz.md）を、答えと自己申告の書き方を添えて書く
    request:
      type: object
      required: [out, answerFormat, questions]
      properties:
        out: { type: string, minLength: 1 }
        answerFormat:
          description: ファイルの先頭に出す書き方。units の topic_id を必須として示し、answers は学習者役が書く欄なので作り手は空にする
          allOf:
            - { $ref: "#/schemas/LearnerAnswers" }
            - { properties: { answers: { type: object, maxProperties: 0 } } }
        questions:
          type: array
          items:
            type: object
            required: [qid, topic_id, order, term, stem, choices]
            additionalProperties: false
            description: 正解・正解の根拠・選択肢ごとの説明の欄を持たない
            properties:
              qid: { type: string, minLength: 1 }
              topic_id: { type: integer, minimum: 1 }
              order: { type: integer, minimum: 1 }
              term: { type: string }
              stem: { type: string, minLength: 1 }
              choices: { type: object, required: ["ア", "イ", "ウ", "エ"], additionalProperties: { type: string } }
    response: { type: object, required: [path], properties: { path: { type: string, const: quiz.md } } }
    errors: []
    examples:
      ok:
        request: { out: ../learner_packs/eng_c8, answerFormat: { answers: {}, units: [{ topic_id: 1, minutes: 5, understood: 3, confusing: "", unknown_terms: [] }] }, questions: [{ qid: t1-1, topic_id: 1, order: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, stem: …, choices: { "ア": …, "イ": …, "ウ": …, "エ": … } }] }
        response: { path: quiz.md }

  writePackExplain:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 説明テストのファイル（explain.md）を書く（語の一覧を持つ学びだけ）
    request:
      type: object
      required: [out, terms]
      properties:
        out: { type: string, minLength: 1 }
        terms: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    response: { type: object, required: [path], properties: { path: { type: string, const: explain.md } } }
    errors: []
    examples:
      ok:
        request: { out: ../learner_packs/eng_c8, terms: [コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）] }
        response: { path: explain.md }

  writePackFigure:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 図を PNG に描いてパックの中に書く（元が PNG ならそのまま写す）
    request:
      type: object
      required: [out, file, target, renderTimeoutSeconds]
      properties:
        out: { type: string, minLength: 1 }
        renderTimeoutSeconds: { type: integer, const: 30, description: 1 つの図を描く待ち時間の上限 }
        file: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?public/figures/materials/[a-z]+/.+\\.(svg|png)$" }
        target: { type: string, pattern: "^figures/.+\\.png$", description: file の public/figures/materials/ の下の学びの key のディレクトリより下のパスを、サブパスごと figures/ の下に保ち、拡張子だけを .png にする }
    response:
      type: object
      required: [path, mediaType]
      properties:
        path: { type: string, pattern: "^figures/.+\\.png$" }
        mediaType: { type: string, const: image/png, description: 元の図に書かれた文字（長音符・中黒を含む）を欠かさずに描いた画像 }
    errors:
      - code: INTERNAL
        when: 図が XML として整わないか、待ち時間の上限のうちに PNG に描けない
    examples:
      ok:
        request: { out: ../learner_packs/eng_c8, file: public/figures/materials/eng/1-1.svg, target: figures/1-1.png, renderTimeoutSeconds: 30 }
        response: { path: figures/1-1.png, mediaType: image/png }
      keepsSubpath:
        request: { out: ../learner_packs/eng_c8, file: public/figures/materials/eng/a/1-1.svg, target: figures/a/1-1.png, renderTimeoutSeconds: 30 }
        response: { path: figures/a/1-1.png, mediaType: image/png }
      notDrawable:
        request: { out: ../learner_packs/figure-not-drawable, file: tests/fixtures/learner-pack/figure-not-drawable/public/figures/materials/itc/16-1.svg, target: figures/16-1.png, renderTimeoutSeconds: 30 }
        error: INTERNAL
      notWellFormed:
        request: { out: ../learner_packs/figure-not-well-formed, file: tests/fixtures/learner-pack/figure-not-well-formed/public/figures/materials/itc/16-2.svg, target: figures/16-2.png, renderTimeoutSeconds: 30 }
        error: INTERNAL

  readLearnerAnswers:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 学習者役が書いて返した答えと自己申告のファイルを読む（行ごとの読めない条件は採点が見る）
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1 }
    response: { $ref: "#/schemas/ReturnedLearnerAnswers" }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: JSON として読めないか、answers か units が無い
    examples:
      looseRows:
        request: { path: ../learner_packs/eng_c11/learner_answers.json }
        response: { answers: {}, units: [{ understood: 3 }, { topic_id: "17" }, { topic_id: 999 }, { topic_id: 2, understood: 5 }] }
      ok:
        request: { path: data/eng/eval/learner_c7_answers.json }
        response:
          answers: { t17-1: ウ, t17-2: ア }
          units: [{ topic_id: 17, minutes: 6, understood: 3, confusing: 2 進数と 16 進数（単位名のみ）と少し混ざりかけた, unknown_terms: [] }]
      missing:
        request: { path: data/eng/eval/learner_c99_answers.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/eng/eval/learner_c7_report.md }
        error: INVALID_INPUT

  readExplainGrades:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 説明テストの採点のファイルを読む
    request:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1 }
    response:
      type: object
      required: [grades]
      properties:
        grades: { type: object, description: 語 → 0・1・2, additionalProperties: { type: integer, enum: [0, 1, 2] } }
    errors:
      - code: NOT_FOUND
        when: ファイルが無い
      - code: INVALID_INPUT
        when: 形として読めない
    examples:
      ok:
        request: { path: data/eng/eval/explain_c6_grade.json }
        response: { grades: { "CPU（命令を読んで計算する中心の部品）": 2 } }
      missing:
        request: { path: data/eng/eval/explain_c99_grade.json }
        error: NOT_FOUND
      unreadable:
        request: { path: data/eng/eval/learner_c6_report.md }
        error: INVALID_INPUT

  readPackSnapshot:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: その周のパックの写しを読む
    request:
      type: object
      required: [data, cycle]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
        cycle: { type: integer, minimum: 1 }
    response: { $ref: "#/schemas/PackSnapshot" }
    errors:
      - code: NOT_FOUND
        when: その周の写しが無い
      - code: INVALID_INPUT
        when: 写しが JSON として読めないか、写しの形を満たさない
    examples:
      ok:
        request: { data: data/eng, cycle: 8 }
        response: { cycle: 8, units: [{ order: 1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み }], questions: [{ qid: t1-1, topic_id: 1, tests_goal: 1, field: コンピュータの仕組み, answer: イ }] }
      missing:
        request: { data: data/eng, cycle: 99 }
        error: NOT_FOUND
      unreadable:
        request: { data: data/eng, cycle: 12 }
        error: INVALID_INPUT

  readCycleResult:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 周の結果を読む（その周の結果があるかと、差を取る前の周の結果）
    request:
      type: object
      required: [data, cycle]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
        cycle: { type: integer, minimum: 1 }
    response:
      type: object
      required: [cycle, rate, avg_understood]
      description: 差を取るのに読むのは rate と avg_understood
      properties:
        cycle: { type: integer, minimum: 1 }
        rate: { type: number, minimum: 0, maximum: 1 }
        avg_understood: { type: number, minimum: 0, maximum: 3 }
    errors:
      - code: NOT_FOUND
        when: その周の結果が無い
      - code: INVALID_INPUT
        when: JSON として読めないか、cycle・rate・avg_understood のどれかが無いか型が違う
    examples:
      ok:
        request: { data: data/eng, cycle: 6 }
        response: { cycle: 6, rate: 1.0, avg_understood: 2.67 }
      missing:
        request: { data: data/eng, cycle: 99 }
        error: NOT_FOUND
      unreadable:
        request: { data: data/eng, cycle: 14 }
        error: INVALID_INPUT

  writePackSnapshot:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: その周のパックの写しを書く（その周の写しも周の結果も無いときだけ buildLearnerPack が呼ぶ）
    request:
      type: object
      required: [data, snapshot]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
        snapshot: { $ref: "#/schemas/PackSnapshot" }
    response: { type: object, required: [path], properties: { path: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+/eval/pack_cycle_[0-9]+\\.json$" } } }
    errors:
      - code: CONFLICT
        when: その周の写しが既にある
    examples:
      exists:
        request: { data: data/eng, snapshot: { cycle: 6, units: [{ order: 1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み }], questions: [{ qid: t1-1, topic_id: 1, tests_goal: 1, field: コンピュータの仕組み, answer: イ }] } }
        error: CONFLICT
      ok:
        request: { data: data/eng, snapshot: { cycle: 8, units: [{ order: 1, topic_id: 1, term: コンピュータの 5 つの働き（入力・記憶・演算・制御・出力）, field: コンピュータの仕組み }], questions: [{ qid: t1-1, topic_id: 1, tests_goal: 1, field: コンピュータの仕組み, answer: イ }] } }
        response: { path: data/eng/eval/pack_cycle_8.json }

  writeCycleResult:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 周の結果を書く（採点が止まらず、その周の結果が無いときだけ gradeLearnerAnswers が呼ぶ）
    request:
      type: object
      required: [data, result]
      properties:
        data: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+$" }
        result: { $ref: "#/schemas/CycleResult" }
    response: { type: object, required: [path], properties: { path: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+/eval/cycle_[0-9]+\\.json$" } } }
    errors:
      - code: CONFLICT
        when: その周の結果が既にある
    examples:
      exists:
        request:
          data: data/eng
          result: { cycle: 6, score: 0/0, rate: 0, by_goal: {}, by_field: {}, per_unit: {}, reported_units: 0, avg_understood: 0, stuck_units: [], overconfident_units: [], unknown_terms: [], shift_suspect: [], shift_window: 3, wrong: [], changed_answers: [] }
        error: CONFLICT
      ok:
        request:
          data: data/eng
          result: { cycle: 8, score: 0/0, rate: 0, by_goal: {}, by_field: {}, per_unit: {}, reported_units: 0, avg_understood: 0, stuck_units: [], overconfident_units: [], unknown_terms: [], shift_suspect: [], shift_window: 3, wrong: [], changed_answers: [] }
        response: { path: data/eng/eval/cycle_8.json }

  writeLearnerInstructions:
    transport: local-store
    direction: outbound
    owned: true
    auth: none
    summary: 雛形から描き出した学びの学習者役への指示を書く
    request:
      type: object
      required: [path, headings, answerFormat]
      properties:
        path: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+/prompts/roadmap_learner\\.md$" }
        headings:
          type: array
          description: 指示の節の見出し。雛形の改訂履歴の節を持たない
          items: { type: string, minLength: 1, not: { const: "## 改訂履歴" } }
        answerFormat:
          description: 指示が示す答えと自己申告の書き方。units の topic_id を必須とする
          allOf:
            - { $ref: "#/schemas/LearnerAnswers" }
            - { properties: { units: { type: array, minItems: 1 } } }
    response: { type: object, required: [path], properties: { path: { type: string, pattern: "^(tests/fixtures/learner-pack/[a-z0-9-]+/)?data/[a-z]+/prompts/roadmap_learner\\.md$" } } }
    errors: []
    examples:
      ok:
        request: { path: data/eng/prompts/roadmap_learner.md, headings: ["# 学習者ロール", "## やること", "## 守ること"], answerFormat: { answers: { t1-1: ア }, units: [{ topic_id: 1, understood: 3, minutes: 5, confusing: "", unknown_terms: [] }] } }
        response: { path: data/eng/prompts/roadmap_learner.md }
