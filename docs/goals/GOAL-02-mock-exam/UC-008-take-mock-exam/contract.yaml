# UC-008 模試（通し受験）の境界。読み方の決まりは docs/adr/ADR-0001、共有語彙は ../../../_shared/components.yaml。
# 振る舞いと規則は ./UC.md と REQ-102〜125・238 が持つ。ここは形だけ。
# 演習（UC-004）と同じ経路を通る操作も、模試の文脈の名で書く（移行中は同じ経路を 2 契約が持つ）。
x-uc: UC-008
x-status: draft
x-spec: ./UC.md
x-updated: 2026-10-01

operations:
  listExams:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 公開回の一覧を、回ごとの問題数・その利用者の受験回数・最高正答数つきで返す
    wire: { method: GET, path: /api/exams, success: 200 }
    response:
      type: object
      required: [exams]
      properties:
        exams:
          type: array
          items:
            type: object
            required: [exam, examLabel, questions, attempts, bestScore]
            properties:
              exam: { type: string, minLength: 1 }
              examLabel: { type: string, minLength: 1 }
              questions: { type: integer, minimum: 1 }
              attempts: { type: integer, minimum: 0 }
              bestScore: { type: [integer, "null"] }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
    examples:
      ok:
        response:
          exams:
            - { exam: 2024r06, examLabel: 令和6年度, questions: 100, attempts: 2, bestScore: 78 }
            - { exam: 2023r05, examLabel: 令和5年度, questions: 100, attempts: 0, bestScore: null }
      unauthenticated: { error: UNAUTHENTICATED }

  startMockExam:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 公開回かランダム構成の模試を作り、範囲の名前・問題数・制限時間を返す
    wire: { method: POST, path: /api/sessions, success: 201 }
    request:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: mock }
        exam:
          type: string
          minLength: 1
          description: 公開回の ID。省略すると全範囲のランダム構成になる
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: ランダム構成の問数。省略時は登録簿の値。回を指定したときは無視される
    response:
      type: object
      required: [id, kind, scopeLabel, questionCount, timeLimitSec]
      properties:
        id: { type: string, minLength: 1 }
        kind: { type: string, const: mock }
        scopeLabel: { type: string, minLength: 1 }
        questionCount: { type: integer, minimum: 1 }
        timeLimitSec: { type: integer, minimum: 1 }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
      - { code: INVALID_INPUT, when: 本文が kind・exam・size の形を満たさない, wire: { status: 400 } }
      - { code: CONFLICT, when: 進行中のテストが既にある（本文に inProgress を添える）, wire: { status: 409 } }
      - { code: INVALID_INPUT, when: 選んだ範囲に出題できる問題が 1 問も無い, wire: { status: 400 } }
    examples:
      okExam:
        request: { kind: mock, exam: 2024r06 }
        response:
          id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55
          kind: mock
          scopeLabel: 令和6年度 を通しで受験
          questionCount: 100
          timeLimitSec: 7200
      okRandom:
        request: { kind: mock }
        response:
          id: 9c5d41b2-0e7a-4f38-b6c1-5a0d3e92f7aa
          kind: mock
          scopeLabel: 全範囲からランダム100問
          questionCount: 100
          timeLimitSec: 7200
      invalidSize:
        request: { kind: mock, size: 0 }
        error: INVALID_INPUT
      inProgress:
        request: { kind: mock, exam: 2024r06 }
        error: CONFLICT
      emptyScope:
        request: { kind: mock, exam: 2009h21a }
        error: INVALID_INPUT
      conflictWinsOverEmptyScope:
        request: { kind: mock, exam: 2009h21a }
        error: CONFLICT

  getMockCurrentQuestion:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 未回答のうち最も小さい位置の問題を、回答済みの件数と残り秒とともに返す
    wire: { method: GET, path: "/api/sessions/{id}/current", success: 200 }
    request:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1, description: 経路の :id }
    response:
      type: object
      required: [session, question, answered, remainingSec, finished]
      properties:
        session: { $ref: "#/schemas/SessionRow" }
        question:
          $ref: ../../../_shared/components.yaml#/schemas/QuestionSnapshot
          description: 終了時・時間切れ時は null
        answered: { type: integer, minimum: 0 }
        remainingSec: { type: [integer, "null"], minimum: 0 }
        finished: { type: boolean }
        expired: { type: boolean, description: finished が true の応答にだけ入る }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
      - { code: NOT_FOUND, when: その ID のテストが無い、または本人の物でない, wire: { status: 404 } }
    examples:
      okQuestion:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        response:
          session: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, kind: mock, scopeLabel: 令和6年度 を通しで受験, questionCount: 100, sourceExam: 2024r06 }
          question:
            idx: 0
            text: 情報セキュリティの三要素のうち、可用性に該当するものはどれか。
            choices: { ア: 許可された者だけが情報を参照できる, イ: 必要なときに情報を利用できる, ウ: 情報が改ざんされていない, エ: 行為者を後から特定できる }
            citation: 令和6年度 問1
            modified: false
            hasFigure: false
            figureDescription: null
            figureImage: null
            timesAsked: 1
            otherCitations: []
          answered: 0
          remainingSec: 7200
          finished: false
      okExpired:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        response:
          session: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, kind: mock, status: in_progress, sourceExam: 2024r06, scopeLabel: 令和6年度 を通しで受験, timeLimitSec: 7200, questionCount: 100, correctCount: null, startedAt: 1759276800, finishedAt: null }
          question: null
          finished: true
          expired: true
          answered: 42
          remainingSec: 0
      unauthenticated:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        error: UNAUTHENTICATED
      notFound:
        request: { id: 00000000-0000-4000-8000-000000000000 }
        error: NOT_FOUND

  submitMockAnswer:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 現在の問題への回答を 1 件記録し、残りの問数と終了したかを返す
    wire: { method: POST, path: "/api/sessions/{id}/answer", success: 200 }
    request:
      type: object
      required: [id, idx, answer]
      properties:
        id: { type: string, minLength: 1, description: 経路の :id }
        idx: { type: integer, minimum: 0 }
        answer: { type: string, enum: [ア, イ, ウ, エ] }
    response:
      type: object
      required: [correct, correctAnswer, explanation, remaining, finished]
      properties:
        correct: { type: boolean }
        correctAnswer: { type: string, enum: [ア, イ, ウ, エ] }
        explanation:
          $ref: "#/schemas/Explanation"
          description: 解説がまだ無い問題は null
        remaining: { type: integer, minimum: 0 }
        finished: { type: boolean }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
      - { code: INVALID_INPUT, when: idx か answer が形を満たさない, wire: { status: 400 } }
      - { code: NOT_FOUND, when: その ID のテストが無い、または本人の物でない, wire: { status: 404 } }
      - { code: CONFLICT, when: そのテストは既に締められている, wire: { status: 409 } }
      - { code: CONFLICT, when: 制限時間を過ぎている（本文に expired を添える）, wire: { status: 409 } }
      - { code: CONFLICT, when: 未回答の問題が 1 問も無い, wire: { status: 409 } }
      - { code: CONFLICT, when: 送られた idx がサーバの現在位置と違う（本文に staleQuestion と expected を添える）, wire: { status: 409 } }
    examples:
      ok:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, idx: 0, answer: イ }
        response: { correct: true, correctAnswer: イ, explanation: null, remaining: 99, finished: false }
      invalidAnswer:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, idx: 0, answer: オ }
        error: INVALID_INPUT
      invalidWinsOverNotFound:
        request: { id: 00000000-0000-4000-8000-000000000000, idx: -1, answer: ア }
        error: INVALID_INPUT
      notFound:
        request: { id: 00000000-0000-4000-8000-000000000000, idx: 0, answer: ア }
        error: NOT_FOUND
      expired:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, idx: 7, answer: ア }
        error: CONFLICT

  finishMockExam:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 模試を締め、正答数と出題数を返す
    wire: { method: POST, path: "/api/sessions/{id}/finish", success: 200 }
    request:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1, description: 経路の :id }
    response:
      type: object
      required: [ok, correct, total]
      properties:
        ok: { type: boolean, const: true }
        correct: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
      - { code: NOT_FOUND, when: その ID のテストが無い、または本人の物でない, wire: { status: 404 } }
    examples:
      ok:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        response: { ok: true, correct: 64, total: 100 }
      unauthenticated:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        error: UNAUTHENTICATED
      notFound:
        request: { id: 00000000-0000-4000-8000-000000000000 }
        error: NOT_FOUND

  getMockResult:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 締めた模試の総合と分野別の正答率、合否の目安とその基準、問題ごとの振り返りを返す
    wire: { method: GET, path: "/api/sessions/{id}", success: 200 }
    request:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1, description: 経路の :id }
    response:
      type: object
      required: [session, overall, fields, passed, expired, criteria, approximation, items]
      properties:
        session: { $ref: "#/schemas/SessionRow" }
        overall:
          type: object
          required: [total, correct, pct]
          properties:
            total: { type: integer, minimum: 0 }
            correct: { type: integer, minimum: 0 }
            pct: { type: integer, minimum: 0, maximum: 100 }
        fields:
          type: array
          items:
            type: object
            required: [field, total, correct, pct]
            properties:
              field: { type: string, minLength: 1 }
              total: { type: integer, minimum: 1 }
              correct: { type: integer, minimum: 0 }
              pct: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        expired: { type: boolean }
        criteria:
          type: object
          required: [overallPct, fieldPct]
          properties:
            overallPct: { type: integer, minimum: 0, maximum: 100 }
            fieldPct: { type: integer, minimum: 0, maximum: 100 }
        approximation: { type: string, minLength: 1 }
        items: { type: array, items: { $ref: "#/schemas/ResultItem" } }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
      - { code: NOT_FOUND, when: その ID のテストが無い、または本人の物でない, wire: { status: 404 } }
      - { code: NOT_FOUND, when: そのテストはまだ締められていない, wire: { status: 404 } }
    examples:
      ok:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        response:
          session: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, kind: mock, status: completed, sourceExam: 2024r06, scopeLabel: 令和6年度 を通しで受験, timeLimitSec: 7200, questionCount: 100, correctCount: 64, startedAt: 1759276800, finishedAt: 1759283500 }
          overall: { total: 100, correct: 64, pct: 64 }
          fields:
            - { field: ストラテジ系, total: 35, correct: 20, pct: 57 }
            - { field: マネジメント系, total: 20, correct: 11, pct: 55 }
            - { field: テクノロジ系, total: 45, correct: 33, pct: 73 }
          passed: true
          expired: false
          criteria: { overallPct: 60, fieldPct: 30 }
          approximation: IPA の合否は項目応答理論（IRT）で算出され換算式が非公開のため、ここでの点数は素点による目安です。
          items:
            - idx: 0
              text: 情報セキュリティの三要素のうち、可用性に該当するものはどれか。
              choices: { ア: 許可された者だけが情報を参照できる, イ: 必要なときに情報を利用できる, ウ: 情報が改ざんされていない, エ: 行為者を後から特定できる }
              answer: イ
              userAnswer: ア
              result: 2
              citation: 令和6年度 問1
              modified: false
              hasFigure: false
              figureDescription: null
              figureImage: null
              timesAsked: 1
              otherCitations: []
              topicId: 118
              topicTerm: 情報セキュリティの三要素
              explanation:
                correctReason: 正解はイ。可用性は必要なときに使える状態を保つ性質を指す。
                choices:
                  - { label: ア, term: 機密性, note: 許可された者だけが参照できる性質。 }
                  - { label: イ, term: null, note: 正解。必要なときに利用できる性質が可用性。 }
                  - { label: ウ, term: 完全性, note: 情報が改ざんされていない性質。 }
                  - { label: エ, term: 責任追跡性, note: 行為者を後から特定できる性質。 }
      unauthenticated:
        request: { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55 }
        error: UNAUTHENTICATED
      notFinished:
        request: { id: 9c5d41b2-0e7a-4f38-b6c1-5a0d3e92f7aa }
        error: NOT_FOUND

schemas:
  SessionRow:
    type: object
    description: 出題中の応答は先頭 5 鍵だけ、終了時の応答と結果は sessions の行の全列が入る
    required: [id, kind, scopeLabel, questionCount, sourceExam]
    properties:
      id: { type: string, minLength: 1 }
      kind: { type: string, const: mock }
      scopeLabel: { type: [string, "null"] }
      questionCount: { type: integer, minimum: 1 }
      sourceExam: { type: [string, "null"], description: 公開回の ID。ランダム構成は null }
      status: { type: string, enum: [in_progress, completed, abandoned] }
      timeLimitSec: { type: [integer, "null"] }
      correctCount: { type: [integer, "null"] }
      startedAt: { type: integer }
      finishedAt: { type: [integer, "null"] }
      userId: { type: string }
  Explanation:
    type: object
    required: [correctReason, choices]
    properties:
      correctReason: { type: string, minLength: 1 }
      choices:
        type: array
        items:
          type: object
          required: [label, term, note]
          properties:
            label: { type: string, enum: [ア, イ, ウ, エ] }
            term: { type: [string, "null"] }
            note: { type: string, minLength: 1 }
  ResultItem:
    type: object
    required: [idx, text, choices, answer, userAnswer, result, citation, modified, hasFigure, figureDescription, figureImage, timesAsked, otherCitations, topicId, topicTerm, explanation]
    properties:
      idx: { type: integer, minimum: 0 }
      text: { type: string, minLength: 1 }
      choices: { type: object, description: ア・イ・ウ・エ を鍵にした選択肢の文 }
      answer: { type: string, enum: [ア, イ, ウ, エ] }
      userAnswer: { type: [string, "null"], enum: [ア, イ, ウ, エ, null] }
      result: { type: integer, enum: [0, 1, 2], description: 0 未回答 / 1 正答 / 2 誤答 }
      citation: { type: string, minLength: 1 }
      modified: { type: boolean }
      hasFigure: { type: boolean }
      figureDescription: { type: [string, "null"] }
      figureImage: { type: [string, "null"] }
      timesAsked: { type: integer, minimum: 1 }
      otherCitations: { type: array, items: { type: string } }
      topicId: { type: [integer, "null"] }
      topicTerm: { type: [string, "null"] }
      explanation:
        $ref: "#/schemas/Explanation"
        description: 解説がまだ無い問題は null
