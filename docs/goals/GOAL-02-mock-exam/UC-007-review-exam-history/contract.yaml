# UC-007 受験履歴の境界。読み方の決まりは docs/adr/ADR-0001、共有語彙は ../../../_shared/components.yaml。
# 振る舞いと規則は ./UC.md と REQ-095〜101 が持つ。ここは形だけ。
# 1 件を選んで結果を開く経路（REQ-098）は UC-004 の getSessionResult が持つ（同じ GET /api/sessions/{id}）。
# 端末の記憶は無い（一覧は毎回サーバから取り直す）。
x-uc: UC-007
x-status: fixed
x-spec: ./UC.md
x-updated: 2026-11-06

operations:
  listExamHistory:
    transport: http
    direction: inbound
    owned: true
    auth: bearer
    summary: 締めたテストを、種別・範囲・問題数・正答数・開始と締めの時刻つきで、締めた時刻の新しい順に返す
    wire: { method: GET, path: /api/sessions, success: 200 }
    response:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 50
          description: 締めた分だけを新しい順に。この maxItems が一覧の上限の SSOT（REQ-096）
          items:
            type: object
            required: [id, kind, scopeLabel, questionCount, correctCount, startedAt, finishedAt, sourceExam]
            properties:
              id: { type: string, minLength: 1 }
              kind: { $ref: "../../../_shared/components.yaml#/schemas/SessionKind" }
              scopeLabel: { type: string, minLength: 1 }
              questionCount: { type: integer, minimum: 1 }
              correctCount: { type: [integer, "null"], minimum: 0 }
              startedAt: { type: integer }
              finishedAt: { type: [integer, "null"] }
              sourceExam: { type: [string, "null"], description: 公開回の ID。ランダム構成と演習は null }
    errors:
      - { code: UNAUTHENTICATED, when: Bearer トークンが無いか読めない, wire: { status: 401 } }
    examples:
      ok:
        response:
          sessions:
            - { id: 3f2a7c1e-5b84-4d6a-9e10-2c7b8a4f0d55, kind: mock, scopeLabel: 令和6年度 を通しで受験, questionCount: 100, correctCount: 64, startedAt: 1759276800, finishedAt: 1759283500, sourceExam: 2024r06 }
            - { id: 9c5d41b2-0e7a-4f38-b6c1-5a0d3e92f7aa, kind: drill, scopeLabel: "論点: RAID", questionCount: 10, correctCount: 8, startedAt: 1759190400, finishedAt: 1759190940, sourceExam: null }
      okEmpty:
        response:
          sessions: []
      unauthenticated: { error: UNAUTHENTICATED }
