<svg xmlns="http://www.w3.org/2000/svg" width="640" height="392" viewBox="0 0 640 392" role="img">
<title>接点を時間の順に並べると、落ちているのがメール本文（1.5％）だと名指しできる。</title>
<rect x="0.5" y="0.5" width="639" height="391" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(170.2 20)">
<line x1="48" y1="34" x2="48" y2="324" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="251.6" y1="34" x2="251.6" y2="324" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="0" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="48" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">自社の接点</text>
<rect x="203.6" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="251.6" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">顧客</text>
<polyline points="51,68 248.6,68" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="248.6,68 240.6,71.6 240.6,64.4" fill="#1f2937"/>
<text x="149.8" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. メールが届く（開封 22％）</text>
<rect x="97.8" y="73" width="104" height="16" rx="3" fill="#ffffff"/>
<text x="149.8" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">持ち主は宣伝担当</text>
<polyline points="248.6,124 51,124" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,124 59,120.4 59,127.6" fill="#1f2937"/>
<text x="149.8" y="117" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2. 本文のリンクを押す（1.5％）</text>
<rect x="-14.1" y="129" width="327.8" height="16" rx="3" fill="#ffffff"/>
<text x="149.8" y="142.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">次にしてほしい行動の案内（CTA）が無いと、ここで落ちる</text>
<polyline points="51,180 248.6,180" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="248.6,180 240.6,183.6 240.6,176.4" fill="#1f2937"/>
<text x="149.8" y="173" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">3. LP で中身を見せる</text>
<polyline points="248.6,220 51,220" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,220 59,216.4 59,223.6" fill="#1f2937"/>
<text x="149.8" y="213" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. フォームを送る</text>
<rect x="13.8" y="225" width="272" height="16" rx="3" fill="#ffffff"/>
<text x="149.8" y="238.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">持ち主は開発担当。継ぎ目は担当者から見えない</text>
<polyline points="51,276 248.6,276" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="248.6,276 240.6,279.6 240.6,272.4" fill="#1f2937"/>
<text x="149.8" y="269" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">5. 初回の連絡</text>
<rect x="97.8" y="281" width="104" height="16" rx="3" fill="#ffffff"/>
<text x="149.8" y="294.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">持ち主は営業担当</text>
</g>
<text x="320" y="372" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">接点を時間の順に並べると、落ちているのがメール本文（1.5％）だと名指しできる。</text>
</svg>
