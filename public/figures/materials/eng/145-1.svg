<svg xmlns="http://www.w3.org/2000/svg" width="640" height="239" viewBox="0 0 657.4 246" role="img">
<title>登録とログインは同じソルトと同じ計算を通るので、保存したハッシュ値と一致するかだけで本人と分かります。</title>
<rect x="0.5" y="0.5" width="656.4" height="245" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(20 20)">
<polyline points="164,38 254,38" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="254,38 246,41.6 246,34.4" fill="#1f2937"/>
<polyline points="362,38 452,38" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="452,38 444,41.6 444,34.4" fill="#1f2937"/>
<polyline points="150,150 240,150" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="240,150 232,153.6 232,146.4" fill="#1f2937"/>
<polyline points="376,150 459,150" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="459,150 451,153.6 451,146.4" fill="#1f2937"/>
<polyline points="534.7,76 534.7,122" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="534.7,122 531.1,114 538.3,114" fill="#1f2937"/>
<rect x="0" y="10" width="164" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="82" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">登録するパスワード</text>
<text x="82" y="52.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">＋利用者ごとのソルト</text>
<rect x="254" y="15" width="108" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="308" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">ハッシュ関数</text>
<path d="M 452 9 A 82.7 9 0 0 0 617.4 9 L 617.4 67 A 82.7 9 0 0 1 452 67 Z" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<path d="M 452 9 A 82.7 9 0 0 1 617.4 9" fill="none" stroke="#1f2937" stroke-width="1"/>
<text x="534.7" y="24.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">保存する物</text>
<text x="534.7" y="44.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">ソルト と ハッシュ値</text>
<text x="534.7" y="64.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">パスワードは持たない</text>
<rect x="14" y="122" width="136" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="82" y="144.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">ログインの入力</text>
<text x="82" y="164.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">＋保存したソルト</text>
<rect x="240" y="127" width="136" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="308" y="154.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">同じハッシュ関数</text>
<rect x="459" y="122" width="151.4" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="534.7" y="144.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">2 つのハッシュ値が</text>
<text x="534.7" y="164.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">一致するかだけ見る</text>
<rect x="373" y="21" width="68" height="16" rx="3" fill="#ffffff"/>
<text x="407" y="34.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">ハッシュ値</text>
<rect x="383.5" y="133" width="68" height="16" rx="3" fill="#ffffff"/>
<text x="417.5" y="146.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">ハッシュ値</text>
<rect x="476.7" y="90" width="116" height="16" rx="3" fill="#ffffff"/>
<text x="534.7" y="103.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">保存したハッシュ値</text>
</g>
<text x="328.7" y="226" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">登録とログインは同じソルトと同じ計算を通るので、保存したハッシュ値と一致するかだけで本人と分かります。</text>
</svg>
