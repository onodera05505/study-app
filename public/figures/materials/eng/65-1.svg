<text x="226.6" y="142.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">前半の 4 つを丸ごと捨てる</text>
<polyline points="51,180 402.2,180" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
