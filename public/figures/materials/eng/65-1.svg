<text x="226.6" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. 3・7・12・18・25・31・40・52 の真ん中の 18 と比べる</text>
