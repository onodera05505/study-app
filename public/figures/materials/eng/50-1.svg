<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img">
<title>点数で合否を出す分かれ道です。条件が真なら上の道、偽なら下の道へ進み、どちらか一方だけを実行します。</title>
<rect x="0.5" y="0.5" width="639" height="307" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(89.65 20)">
<polyline points="133.9,120 173.9,120" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="173.9,120 165.9,123.6 165.9,116.4" fill="#1f2937"/>
<polyline points="229.3,92 229.3,69 392.7,69 392.7,46" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="392.7,46 396.3,54 389.1,54" fill="#1f2937"/>
<polyline points="229.3,148 229.3,171 392.7,171 392.7,194" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="392.7,194 389.1,186 396.3,186" fill="#1f2937"/>
<rect x="0" y="92" width="133.9" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="66.95" y="114.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">点数</text>
<text x="66.95" y="134.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">例えば 70 か 50</text>
<rect x="173.9" y="92" width="110.8" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="229.3" y="114.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">もし 点数 が</text>
<text x="229.3" y="134.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">60 以上 なら</text>
<rect x="331.7" y="0" width="122" height="46" rx="23" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="392.7" y="27.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">「合格」と表示</text>
<rect x="324.7" y="194" width="136" height="46" rx="23" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="392.7" y="221.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">「不合格」と表示</text>
<rect x="267.1" y="55" width="87.8" height="16" rx="3" fill="#ffffff"/>
<text x="311" y="68.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">真（70 なら）</text>
<rect x="267.1" y="157" width="87.8" height="16" rx="3" fill="#ffffff"/>
<text x="311" y="170.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">偽（50 なら）</text>
</g>
<text x="320" y="288" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">点数で合否を出す分かれ道です。条件が真なら上の道、偽なら下の道へ進み、どちらか一方だけを実行します。</text>
</svg>
