<svg xmlns="http://www.w3.org/2000/svg" width="640" height="122" viewBox="0 0 648.8 124" role="img">
<title>復旧はフルで復元してから最新の差分を1つ反映する2段階で、差分だけでは元に戻せない。</title>
<rect x="0.5" y="0.5" width="647.8" height="123" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(20 20)">
<polyline points="136,28 269.4,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="269.4,28 261.4,31.6 261.4,24.4" fill="#1f2937"/>
<polyline points="365.4,28 505.8,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="505.8,28 497.8,31.6 497.8,24.4" fill="#1f2937"/>
<path d="M 0 14 A 68 9 0 0 0 136 14 L 136 42 A 68 9 0 0 1 0 42 Z" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<path d="M 0 14 A 68 9 0 0 1 136 14" fill="none" stroke="#1f2937" stroke-width="1"/>
<text x="68" y="34.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">フルバックアップ</text>
<path d="M 269.4 14 A 48 9 0 0 0 365.4 14 L 365.4 42 A 48 9 0 0 1 269.4 42 Z" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<path d="M 269.4 14 A 48 9 0 0 1 365.4 14" fill="none" stroke="#1f2937" stroke-width="1"/>
<text x="317.4" y="34.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">最新の差分</text>
<rect x="505.8" y="0" width="96" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="553.8" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">障害直前の</text>
<text x="553.8" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">状態に復旧</text>
<rect x="168.1" y="11" width="69.2" height="16" rx="3" fill="#ffffff"/>
<text x="202.7" y="24.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">① 復元する</text>
<rect x="376.4" y="11" width="118.4" height="16" rx="3" fill="#ffffff"/>
<text x="435.6" y="24.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">② 1 つだけ反映する</text>
</g>
<text x="324.4" y="104" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">復旧はフルで復元してから最新の差分を1つ反映する2段階で、差分だけでは元に戻せない。</text>
</svg>
