<text x="329.8" y="166.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ブラウザの種類と版を調べ、通用する脆弱性を選ぶ</text>
