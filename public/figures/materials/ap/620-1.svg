<text x="425.2" y="282.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">ジョブC（単独15分）</text>
</g>
<text x="320" y="334" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ジョブが1本終わるたびに残りの進みが速くなる。15分と25分で区間を区切れば、ジョブBの終了は25分と分か</text>
