<svg xmlns="http://www.w3.org/2000/svg" width="640" height="100" viewBox="0 0 793.4 124" role="img">
<title>合計に入るのは隣り合う移り変わり3回分だけ。b→a→c→d なら 1＋1＋2＝4 時間で最小になる。</title>
<rect x="0.5" y="0.5" width="792.4" height="123" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(20 20)">
<polyline points="136,28 238.8,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="238.8,28 230.8,31.6 230.8,24.4" fill="#1f2937"/>
<polyline points="334.8,28 444.6,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="444.6,28 436.6,31.6 436.6,24.4" fill="#1f2937"/>
<polyline points="540.6,28 644.4,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="644.4,28 636.4,31.6 636.4,24.4" fill="#1f2937"/>
<rect x="0" y="0" width="136" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="68" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">仕事 b</text>
<text x="68" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">最初は段取りなし</text>
<rect x="238.8" y="5" width="96" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="286.8" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">仕事 a</text>
<rect x="444.6" y="5" width="96" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="492.6" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">仕事 c</text>
<rect x="644.4" y="0" width="108" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="698.4" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">仕事 d</text>
<text x="698.4" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">最後で終わり</text>
<rect x="143.5" y="11" width="87.8" height="16" rx="3" fill="#ffffff"/>
<text x="187.4" y="24.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">段取り 1 時間</text>
<rect x="367.1" y="11" width="45.2" height="16" rx="3" fill="#ffffff"/>
<text x="389.7" y="24.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1 時間</text>
<rect x="569.9" y="11" width="45.2" height="16" rx="3" fill="#ffffff"/>
<text x="592.5" y="24.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2 時間</text>
</g>
<text x="396.7" y="104" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">合計に入るのは隣り合う移り変わり3回分だけ。b→a→c→d なら 1＋1＋2＝4 時間で最小になる。</text>
