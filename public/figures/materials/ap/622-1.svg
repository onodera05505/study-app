<text x="774.9" y="238.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">外すまでは、他の読み取りも書き換えも待つ（確定前の値を読ませない）</text>
