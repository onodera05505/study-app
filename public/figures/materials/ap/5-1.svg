</g>
<text x="349.45" y="328" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">回線を渡る 0.08 ミリ秒が 3 回と、スイッチの処理 0.2 ミリ秒が 2 回で、合計 0.64 ミリ秒になる。</text>
