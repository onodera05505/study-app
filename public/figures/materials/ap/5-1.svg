<text x="141.7" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1,000 バイト＝8,000 ビット ÷ 100M ビット／秒</text>
