<text x="405" y="236" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ファイル方式は階層をたどって目的のデータに届くが、オブジェクト方式は階層を持たず識別子で直接指す。</text>
