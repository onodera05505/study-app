<svg xmlns="http://www.w3.org/2000/svg" width="640" height="318" viewBox="0 0 640 318" role="img">
<title>3 つの合図のどれが出ても、強さを落として続けるのではなく手を離す。合図を決めるのは相手の側。</title>
<rect x="0.5" y="0.5" width="639" height="317" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(41 20)">
<polyline points="96,46 96,69 293,69 293,92" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="293,92 289.4,84 296.6,84" fill="#1f2937"/>
<polyline points="144,120 232,120" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="232,120 224,123.6 224,116.4" fill="#1f2937"/>
<polyline points="96,194 96,171 293,171 293,148" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="293,148 296.6,156 289.4,156" fill="#1f2937"/>
<polyline points="354,120 394,120" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="394,120 386,123.6 386,116.4" fill="#1f2937"/>
<rect x="35" y="0" width="122" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="96" y="27.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">「痛い」と言う</text>
<rect x="48" y="92" width="96" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="96" y="114.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">息を詰めて</text>
<text x="96" y="134.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">体が固まる</text>
<rect x="0" y="194" width="192" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="96" y="216.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">「ビリビリする」</text>
<text x="96" y="236.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">しびれ（神経からの合図）</text>
<rect x="232" y="92" width="122" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="293" y="114.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">手を離して</text>
<text x="293" y="134.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">その回を終える</text>
<rect x="394" y="92" width="164" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="476" y="114.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">「今のは強かった？」</text>
<text x="476" y="134.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">と聞いて返事を待つ</text>
</g>
<text x="320" y="298" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">3 つの合図のどれが出ても、強さを落として続けるのではなく手を離す。合図を決めるのは相手の側。</text>
</svg>
