<svg xmlns="http://www.w3.org/2000/svg" width="640" height="226" viewBox="0 0 640 226" role="img">
<title>硬い所は壊れた組織ではなく縮んだ筋で、痛みがまた筋を縮ませるので張りが続く。</title>
<rect x="0.5" y="0.5" width="639" height="225" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(90 20)">
<polyline points="122,28 162,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="162,28 154,31.6 154,24.4" fill="#1f2937"/>
<polyline points="284,28 324,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="324,28 316,31.6 316,24.4" fill="#1f2937"/>
<polyline points="392,56 392,102" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="392,102 388.4,94 395.6,94" fill="#1f2937"/>
<polyline points="338,130 271,130" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="271,130 279,126.4 279,133.6" fill="#1f2937"/>
<polyline points="223,107 223,51" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="223,51 226.6,59 219.4,59" fill="#1f2937"/>
<rect x="0" y="5" width="122" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="61" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">同じ姿勢が続く</text>
<rect x="162" y="5" width="122" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="223" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">筋が縮んだまま</text>
<rect x="324" y="0" width="136" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="392" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">周りより硬い部分</text>
<text x="392" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">押すと痛みやすい</text>
<rect x="338" y="102" width="108" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="392" y="124.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">血流と酸素が</text>
<text x="392" y="144.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">足りない</text>
<rect x="175" y="107" width="96" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="223" y="134.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">張り／痛み</text>
<rect x="165" y="70" width="116" height="16" rx="3" fill="#ffffff"/>
<text x="223" y="83.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">痛みが筋を縮ませる</text>
</g>
<text x="320" y="206" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">硬い所は壊れた組織ではなく縮んだ筋で、痛みがまた筋を縮ませるので張りが続く。</text>
</svg>
