<text x="193.9" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. 本題の前に約束を頼む（自分の側にも当てる）</text>
<rect x="63.9" y="73" width="260" height="16" rx="3" fill="#ffffff"/>
<text x="193.9" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">分からない所は聞き返す・違っていたら直して</text>
<polyline points="336.8,124 51,124" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,124 59,120.4 59,127.6" fill="#1f2937"/>
<text x="193.9" y="117" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2. 約束に乗る</text>
<polyline points="336.8,164 51,164" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,164 59,160.4 59,167.6" fill="#1f2937"/>
<text x="193.9" y="157" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">3. 本題を話す</text>
<polyline points="51,204 336.8,204" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="336.8,204 328.8,207.6 328.8,200.4" fill="#1f2937"/>
<text x="193.9" y="197" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. 途中で「そこが分かりません」と聞き返す</text>
<rect x="9.9" y="209" width="368" height="16" rx="3" fill="#ffffff"/>
<text x="193.9" y="222.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">決めてあった動きなので、話の腰を折ったように受け取られにくい</text>
<polyline points="336.8,260 51,260" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
