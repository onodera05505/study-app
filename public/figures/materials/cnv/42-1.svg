<text x="339.8" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">相手</text>
<polyline points="51,68 336.8,68" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
