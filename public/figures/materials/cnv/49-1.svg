<text x="224.9" y="117" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2. 「決まる前に戻ってもいいですか」</text>
<rect x="136.9" y="129" width="176" height="16" rx="3" fill="#ffffff"/>
<text x="224.9" y="142.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">了解にせず、決まる手前へ戻す</text>
<polyline points="391.8,180 58,180" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="58,180 66,176.4 66,183.6" fill="#1f2937"/>
<text x="224.9" y="173" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">3. 手前の事情を一つたずねる「どこがきつくなりますか」</text>
<polyline points="58,220 391.8,220" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="391.8,220 383.8,223.6 383.8,216.4" fill="#1f2937"/>
<text x="224.9" y="213" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. 「2時からは出られません」</text>
<polyline points="391.8,260 58,260" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="58,260 66,256.4 66,263.6" fill="#1f2937"/>
<text x="224.9" y="253" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">5. 決め直す「2時までをお願いします」</text>
