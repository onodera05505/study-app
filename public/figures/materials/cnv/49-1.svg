<rect x="76.9" y="73" width="296" height="16" rx="3" fill="#ffffff"/>
<text x="224.9" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">「まあ」とひと呼吸の間＝言葉と様子がそろわない印</text>
<polyline points="391.8,124 58,124" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
