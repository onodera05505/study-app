<text x="146.9" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. 困りごとを話す</text>
<rect x="-61.1" y="73" width="416" height="16" rx="3" fill="#ffffff"/>
<text x="146.9" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ここで直し方を出すと、分かってもらえていないと受け取られることがある</text>
