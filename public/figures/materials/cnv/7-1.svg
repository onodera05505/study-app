<polygon points="58,204 66,200.4 66,207.6" fill="#1f2937"/>
<text x="146.9" y="197" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. どこで困っているかを聞く</text>
<polyline points="235.8,244 58,244" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="58,244 66,240.4 66,247.6" fill="#1f2937"/>
<text x="146.9" y="237" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">5. 案を一つの考えとして出す</text>
<rect x="10.9" y="249" width="272" height="16" rx="3" fill="#ffffff"/>
<text x="146.9" y="262.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">求められたときか、受け止めて続きを聞いたあと</text>
