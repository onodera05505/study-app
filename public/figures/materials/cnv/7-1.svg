<polygon points="235.8,164 227.8,167.6 227.8,160.4" fill="#1f2937"/>
<text x="146.9" y="157" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">3. 続きを話す</text>
