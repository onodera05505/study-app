<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img">
<title>PUSH も POP も一番上だけに効くので、下にある a を b より先に取り出すことはできない。</title>
<rect x="0.5" y="0.5" width="639" height="307" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(123.05 20)">
<polyline points="262.8,28 138.8,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="138.8,28 146.8,24.4 146.8,31.6" fill="#1f2937"/>
<polygon points="262.8,28 254.8,31.6 254.8,24.4" fill="#1f2937"/>
<polyline points="69.4,51 69.4,102" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="69.4,148 69.4,194" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="262.8" y="0" width="131.1" height="56" rx="28" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="328.35" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">PUSH（積む）</text>
<text x="328.35" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">POP（取り出す）</text>
<rect x="0" y="5" width="138.8" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="69.4" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">c ← 最後に入れた</text>
<rect x="21.4" y="102" width="96" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="69.4" y="129.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">b</text>
<rect x="0" y="194" width="138.8" height="46" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="69.4" y="221.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">a ← 最初に入れた</text>
<rect x="142.8" y="11" width="116" height="16" rx="3" fill="#ffffff"/>
<text x="200.8" y="24.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">出し入れは上端だけ</text>
</g>
<text x="320" y="288" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">PUSH も POP も一番上だけに効くので、下にある a を b より先に取り出すことはできない。</text>
</svg>
