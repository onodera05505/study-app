<svg xmlns="http://www.w3.org/2000/svg" width="640" height="151" viewBox="0 0 652 154" role="img">
<title>入力層と出力層の間に中間層を何層も重ね、誤差を逆向きに伝えて重みを直しながら特徴をつかみます。</title>
<rect x="0.5" y="0.5" width="651" height="153" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(20 20)">
<polyline points="103,28 157,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="157,28 149,31.6 149,24.4" fill="#1f2937"/>
<polyline points="253,28 300,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="300,28 292,31.6 292,24.4" fill="#1f2937"/>
<polyline points="450,28 490,28" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="490,28 482,31.6 482,24.4" fill="#1f2937"/>
<polyline points="551,56 551,78 55,78 55,56" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
<polygon points="55,56 58.6,64 51.4,64" fill="#1f2937"/>
<rect x="7" y="0" width="96" height="56" rx="28" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="55" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">入力層</text>
<text x="55" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">画像データ</text>
<rect x="157" y="5" width="96" height="46" rx="23" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="205" y="32.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">中間層1</text>
<rect x="300" y="0" width="150" height="56" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="375" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">中間層2</text>
<text x="375" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">さらに何層も重ねる</text>
<rect x="490" y="0" width="122" height="56" rx="28" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="551" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">出力層</text>
<text x="551" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">犬か猫かを判定</text>
<rect x="258.6" y="64" width="188" height="16" rx="3" fill="#ffffff"/>
<text x="352.6" y="77.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">誤差を逆向きに伝えて重みを修正</text>
</g>
<text x="326" y="134" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">入力層と出力層の間に中間層を何層も重ね、誤差を逆向きに伝えて重みを直しながら特徴をつかみます。</text>
