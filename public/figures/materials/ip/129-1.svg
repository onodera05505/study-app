<svg xmlns="http://www.w3.org/2000/svg" width="640" height="346" viewBox="0 0 640 346" role="img">
<title>導入計画書を出して合意を得るのが作業の前、導入報告書を出すのが作業のあとという順序を表します。</title>
<rect x="0.5" y="0.5" width="639" height="345" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(175 20)">
<line x1="48" y1="34" x2="48" y2="278" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="221" y1="34" x2="221" y2="278" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="0" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="48" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">導入担当</text>
<rect x="152" y="0" width="138" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="221" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">利用部門・責任者</text>
<polyline points="51,68 218,68" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="218,68 210,71.6 210,64.4" fill="#1f2937"/>
<text x="134.5" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. 導入計画書を提出</text>
<rect x="88.5" y="73" width="92" height="16" rx="3" fill="#ffffff"/>
<text x="134.5" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">作業の前に作る</text>
<polyline points="218,124 51,124" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,124 59,120.4 59,127.6" fill="#1f2937"/>
<text x="134.5" y="117" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2. 内容に合意</text>
<rect x="88.5" y="129" width="92" height="16" rx="3" fill="#ffffff"/>
<text x="134.5" y="142.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">合意も作業の前</text>
<polyline points="48,172 74,172 74,186 50,186" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="50,186 58,182.4 58,189.6" fill="#1f2937"/>
<text x="82" y="180" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">3. 導入作業</text>
<rect x="-34" y="191" width="164" height="16" rx="3" fill="#ffffff"/>
<text x="48" y="204.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">本番環境へインストールする</text>
<polyline points="51,230 218,230" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="218,230 210,233.6 210,226.4" fill="#1f2937"/>
<text x="134.5" y="223" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. 導入報告書を提出</text>
<rect x="76.5" y="235" width="116" height="16" rx="3" fill="#ffffff"/>
<text x="134.5" y="248.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">報告書は作業のあと</text>
</g>
<text x="320" y="326" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">導入計画書を出して合意を得るのが作業の前、導入報告書を出すのが作業のあとという順序を表します。</text>
</svg>
