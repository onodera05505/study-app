<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img">
<title>大きいほうから小さいほうを引くのを繰り返し、x と y が等しくなったら終了。残った 14 が答え。</title>
<rect x="0.5" y="0.5" width="639" height="319" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(156.7 20)">
<line x1="48" y1="34" x2="48" y2="252" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="278.6" y1="34" x2="278.6" y2="252" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="0" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="48" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">変数 x</text>
<rect x="230.6" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="278.6" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">変数 y</text>
<polyline points="275.6,68 51,68" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,68 59,64.4 59,71.6" fill="#1f2937"/>
<text x="163.3" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. x＞y なので x ← 98 － 42 ＝ 56</text>
<rect x="81" y="73" width="164.6" height="16" rx="3" fill="#ffffff"/>
<text x="163.3" y="86.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">はじめは x が 98、y が 42</text>
<polyline points="275.6,124 51,124" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,124 59,120.4 59,127.6" fill="#1f2937"/>
<text x="163.3" y="117" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2. x＞y なので x ← 56 － 42 ＝ 14</text>
<polyline points="51,164 275.6,164" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="275.6,164 267.6,167.6 267.6,160.4" fill="#1f2937"/>
<text x="163.3" y="157" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">3. x≦y なので y ← 42 － 14 ＝ 28</text>
<polyline points="51,204 275.6,204" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="275.6,204 267.6,207.6 267.6,200.4" fill="#1f2937"/>
<text x="163.3" y="197" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. x≦y なので y ← 28 － 14 ＝ 14</text>
<rect x="36.9" y="209" width="252.8" height="16" rx="3" fill="#ffffff"/>
<text x="163.3" y="222.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">x＝y になり終了条件を満たす。x の値は 14</text>
</g>
<text x="320" y="300" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">大きいほうから小さいほうを引くのを繰り返し、x と y が等しくなったら終了。残った 14 が答え。</text>
</svg>
