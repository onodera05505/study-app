<svg xmlns="http://www.w3.org/2000/svg" width="640" height="288" viewBox="0 0 752.4 338" role="img">
<title>音声をテキストに変える音声認識、意味を理解して応答を作る自然言語処理、読み上げる音声合成の分担を表します。</title>
<rect x="0.5" y="0.5" width="751.4" height="337" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(20 20)">
<line x1="48" y1="34" x2="48" y2="270" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="248.8" y1="34" x2="248.8" y2="270" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="456.6" y1="34" x2="456.6" y2="270" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="664.4" y1="34" x2="664.4" y2="270" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="0" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="48" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">利用者</text>
<rect x="200.8" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="248.8" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">音声認識</text>
<rect x="401.6" y="0" width="110" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="456.6" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">自然言語処理</text>
<rect x="616.4" y="0" width="96" height="34" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="664.4" y="21.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">音声合成</text>
<polyline points="51,68 245.8,68" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="245.8,68 237.8,71.6 237.8,64.4" fill="#1f2937"/>
<text x="148.4" y="61" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">1. 話し掛ける（音声）</text>
<polyline points="251.8,108 453.6,108" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="453.6,108 445.6,111.6 445.6,104.4" fill="#1f2937"/>
<text x="352.7" y="101" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">2. テキストデータに変換して渡す</text>
<rect x="234.7" y="113" width="236" height="16" rx="3" fill="#ffffff"/>
<text x="352.7" y="126.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">認識は入り口の変換。ここだけが音声認識</text>
<polyline points="456.6,156 482.6,156 482.6,170 458.6,170" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="458.6,170 466.6,166.4 466.6,173.6" fill="#1f2937"/>
<text x="490.6" y="164" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">3. 意味を理解して応答を組み立てる</text>
<polyline points="459.6,198 661.4,198" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="661.4,198 653.4,201.6 653.4,194.4" fill="#1f2937"/>
<text x="560.5" y="191" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">4. 応答のテキストを渡す</text>
<polyline points="661.4,238 51,238" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="51,238 59,234.4 59,241.6" fill="#1f2937"/>
<text x="356.2" y="231" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">5. 読み上げて返す（音声）</text>
</g>
<text x="376.2" y="318" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">音声をテキストに変える音声認識、意味を理解して応答を作る自然言語処理、読み上げる音声合成の分担を表します。</text>
</svg>
