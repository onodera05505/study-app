<svg xmlns="http://www.w3.org/2000/svg" width="640" height="226" viewBox="0 0 640 226" role="img">
<title>帰納は事例から規則へ積み上げる向き、演繹は規則から事例へ下る向きです。</title>
<rect x="0.5" y="0.5" width="639" height="225" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<g transform="translate(240.45 20)">
<polyline points="71.55,102 71.55,56" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="71.55,56 75.15,64 67.95,64" fill="#1f2937"/>
<polyline points="87.55,56 87.55,102" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="87.55,102 83.95,94 91.15,94" fill="#1f2937"/>
<rect x="11.55" y="0" width="136" height="56" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
<text x="79.55" y="22.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">共通する規則</text>
<text x="79.55" y="42.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">（一般的な法則）</text>
<rect x="0" y="102" width="159.1" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="79.55" y="124.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">個々の事例</text>
<text x="79.55" y="144.9" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">事例1・事例2・事例3</text>
<rect x="13.55" y="70" width="56" height="16" rx="3" fill="#ffffff"/>
<text x="41.55" y="83.2" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">帰納推論</text>
