<text x="320" y="334" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">発注量を増やすと発注費用は下がり、在庫維持費用は上がります。合計が最小になる量が最適な発注量です。</text>
